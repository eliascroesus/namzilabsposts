<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Namzilabs · Showcase (the real app in seven seconds)</title>
<link rel="stylesheet" href="../../lib/brand.css">
<style>
  /* Seven seconds of the real app on a dark stage: the dashboard swings up in 3D, the camera
     dives into its KPI cards, whips to the flow builder (steps ringed 1, 2, 3), then to two
     funnels (one per source) that draw themselves, and lands on the logo.
     One file, three formats:  ?fmt=tall (1080×1920, default)  ·  ?fmt=wide (1920×1080)  ·  ?fmt=4x3 (1440×1080).
     Every screen is a real screenshot (screenshots/app, crops in screenshots/shots.js).
       node tools/render-video.mjs videos/15-showcase/video.html videos/15-showcase/showcase-9x16.mp4
       node tools/render-video.mjs videos/15-showcase/video.html videos/15-showcase/showcase-16x9.mp4 --query fmt=wide
       node tools/render-video.mjs videos/15-showcase/video.html videos/15-showcase/showcase-4x3.mp4 --query fmt=4x3 */
  .stage { position: absolute; inset: 0; overflow: hidden; color: #fff;
    background: radial-gradient(120% 80% at 50% 110%, #0d1a3d 0%, rgba(13, 26, 61, 0) 60%), linear-gradient(180deg, #05070d 0%, #070b16 100%); }
  .glow { position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(47, 95, 216, 0.55) 0%, rgba(47, 95, 216, 0.18) 36%, rgba(47, 95, 216, 0) 66%); }
  .grid { position: absolute; inset: -10%; pointer-events: none;
    background-image: linear-gradient(to right, rgba(143, 178, 255, 0.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(143, 178, 255, 0.07) 1px, transparent 1px);
    background-size: 96px 96px;
    -webkit-mask-image: radial-gradient(60% 50% at 50% 55%, #000 10%, transparent 75%); mask-image: radial-gradient(60% 50% at 50% 55%, #000 10%, transparent 75%); }
  .scene { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 46%; }

  /* the app window: one crop of a real screen */
  .win { position: absolute; left: 0; top: 0; border-radius: 22px; overflow: hidden; background: #fff; transform-origin: 50% 50%;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 90px 160px -50px rgba(0, 0, 0, 0.9), 0 30px 70px -30px rgba(3, 8, 30, 0.8); }
  .win img { position: absolute; display: block; max-width: none; height: auto; }
  .win .sheen { position: absolute; top: -30%; bottom: -30%; width: 38%; left: 0;
    background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.34) 50%, rgba(255, 255, 255, 0) 100%); transform: translateX(-120%) skewX(-12deg); pointer-events: none; }
  /* a piece of a window lifted off its surface */
  .lift { position: absolute; overflow: hidden; border-radius: 20px; box-shadow: 0 0 0 0 rgba(47, 95, 216, 0); }
  .lift img { position: absolute; display: block; max-width: none; height: auto; }
  /* focus rings, as on the highlights */
  .ring { position: absolute; border: 5px solid #2f5fd8; border-radius: 18px; box-shadow: 0 0 0 9px rgba(47, 95, 216, 0.18); opacity: 0; }
  .ring .n { position: absolute; right: 20px; top: -28px; width: 52px; height: 52px; border-radius: 50%; background: #2f5fd8; color: #fff; font-size: 28px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 8px 18px rgba(20, 40, 120, 0.4); }
  .pring { position: absolute; border-radius: 999px; box-shadow: 0 0 0 4px #2f5fd8, 0 0 0 12px rgba(47, 95, 216, 0.2); opacity: 0; }
  /* a funnel draws itself under its header: a soft leading edge over the part still to come */
  .drawbox { position: absolute; overflow: hidden; }
  .edge { position: absolute; top: 0; bottom: 0; width: 160px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 70%); }
  .rest { position: absolute; top: 0; bottom: 0; right: 0; background: #fff; }

  /* captions */
  .cap { position: absolute; font-weight: 800; letter-spacing: -0.052em; line-height: 0.95; white-space: nowrap; }
  .cap em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; padding-right: 0.04em; }
  .wmask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.05em 0.16em 0; margin-bottom: -0.16em; }
  .wi { display: inline-block; }
  .kick { position: absolute; display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); font-size: 26px; font-weight: 650; letter-spacing: -0.01em; color: rgba(232, 238, 255, 0.92); }
  .kick i { width: 11px; height: 11px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 5px rgba(52, 199, 89, 0.22); }

  /* the end: the rings draw, the name, the ask */
  .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .end svg { overflow: visible; }
  .end svg circle { fill: none; stroke: #fff; stroke-linecap: round; }
  .end .name { margin-top: 34px; font-size: 92px; font-weight: 800; letter-spacing: -0.05em; }
  .end .go { margin-top: 40px; display: inline-flex; align-items: center; height: 76px; padding: 0 36px; border-radius: 999px; background: #2f5fd8; color: #fff; font-size: 30px; font-weight: 750; letter-spacing: -0.015em; box-shadow: 0 20px 50px -14px rgba(47, 95, 216, 0.8); }

  .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); }
  .vign { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(90% 70% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%); }
</style>
</head>
<body>
<div class="canvas" id="cv">
  <div class="stage">
    <div class="glow" id="glow"></div>
    <div class="grid" id="grid"></div>
    <div class="scene" id="scene"></div>
    <div class="cap" id="c1">All your <em>data.</em></div>
    <div class="cap" id="c2">One <em>place.</em></div>
    <div class="cap" id="c3">Any <em>KPI.</em></div>
    <div class="cap" id="c4">Where it <em>breaks.</em></div>
    <div class="kick" id="kick"><i></i>The real app</div>
    <div class="end" id="end">
      <svg id="mark" viewBox="0 0 64 64"><circle id="r1" cx="25" cy="32" r="15" pathLength="1" transform="rotate(-90 25 32)"/><circle id="r2" cx="39" cy="32" r="15" pathLength="1" transform="rotate(90 39 32)"/></svg>
      <div class="name" id="name">Namzilabs</div>
      <div class="go" id="go">Start free · namzilabs.co</div>
    </div>
    <div class="vign"></div>
    <div class="grain"></div>
  </div>
</div>

<script src="../../screenshots/shots.js"></script>
<script src="../../lib/motion.js"></script>
<script>
const FMT = { wide: [1920, 1080], "4x3": [1440, 1080] }[new URLSearchParams(location.search).get("fmt")] ? new URLSearchParams(location.search).get("fmt") : "tall";
const [W, H] = { tall: [1080, 1920], wide: [1920, 1080], "4x3": [1440, 1080] }[FMT];
const cv = document.getElementById("cv");
cv.style.width = W + "px"; cv.style.height = H + "px";
const E = NZ.ease, $ = (id) => document.getElementById(id);
const SH = NZ.SHOTS;

/* ── layout, per format ─────────────────────────────────────────────── */
const L = {
  wide: {
  cap: { x: 120, y: 118, size: 104 }, kick: { x: 124, y: 60 },
  hero: { w: 1560, cx: 1010, cy: 585 }, kpiW: 1240, diveY: 655,
  card: { w: 680, cx: 740, cy: 655 }, steps: { w: 510, cx: 1320, cy: 645 },
  funnel: { w: 860, at: [{ cx: 505, cy: 650, ry: 9 }, { cx: 1415, cy: 650, ry: -9 }] },
  glow: { s: 1500, x: 960, y: 560 }, mark: 230,
  },
  // 4:3: the wide layout, drawn in: the funnels stack, staggered, instead of sitting side by side
  "4x3": {
  cap: { x: 100, y: 112, size: 96 }, kick: { x: 104, y: 54 },
  hero: { w: 1400, cx: 790, cy: 590 }, kpiW: 1160, diveY: 660,
  card: { w: 600, cx: 520, cy: 655 }, steps: { w: 470, cx: 1010, cy: 645 },
  funnel: { w: 780, at: [{ cx: 650, cy: 468, ry: -5 }, { cx: 800, cy: 852, ry: 5 }] },
  glow: { s: 1400, x: 720, y: 560 }, mark: 220,
  },
  tall: {
  cap: { x: 90, y: 262, size: 128 }, kick: { x: 94, y: 170 },
  hero: { w: 1640, cx: 575, cy: 990 }, kpiW: 960, diveY: 1037,
  card: { w: 720, cx: 470, cy: 900 }, steps: { w: 600, cx: 640, cy: 1230 },
  funnel: { w: 980, at: [{ cx: 540, cy: 805, ry: -5 }, { cx: 540, cy: 1310, ry: 5 }] },
  glow: { s: 1500, x: 540, y: 1000 }, mark: 250,
  },
}[FMT];

/* ── a window: a crop of a real screen, sized to w, with px() for image → window coordinates ── */
function win(src, crop, w, parent = $("scene")) {
  const s = SH[src], [x, y, cw, ch] = Array.isArray(crop) ? crop : s.crops[crop];
  const k = w / cw, h = Math.round(ch * k);
  const el = document.createElement("div");
  el.className = "win"; el.style.width = w + "px"; el.style.height = h + "px";
  el.innerHTML = `<img src="../../${s.file}" alt="" style="width:${s.w * k}px;left:${-x * k}px;top:${-y * k}px"><div class="sheen"></div>`;
  parent.appendChild(el);
  const px = (ix, iy) => [(ix - x) * k, (iy - y) * k];
  const box = (r) => { const [a, b] = px(r[0], r[1]); return [a, b, r[2] * k, r[3] * k]; };
  return { el, w, h, k, px, box, src: s, crop: [x, y, cw, ch], sheen: el.querySelector(".sheen") };
}
function place(el, [x, y, w, h], cls, html = "") {
  const d = document.createElement("div");
  d.className = cls; Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  d.innerHTML = html; el.appendChild(d); return d;
}

/* the dashboard, whole: the sidebar and the Overview, cut below the workspace switcher */
const hero = win("overview", [0, 128, 3456, 1792], L.hero.w);
// three KPI cards, lifted off the dashboard as the camera arrives (same image, same pixels)
const KPI = [[571, 289, 435, 207], [1040, 289, 437, 207], [1510, 289, 438, 207]];
const lifts = KPI.map((r) => {
  const [x, y, w, h] = hero.box(r);
  const d = place(hero.el, [x, y, w, h], "lift", `<img src="../../${hero.src.file}" alt="" style="width:${hero.src.w * hero.k}px;left:${-r[0] * hero.k}px;top:${-r[1] * hero.k}px">`);
  return d;
});
// where the camera dives: the KPI rows, centred in the frame
const KPI_AREA = [571, 289, 1378, 445];

/* the flow builder: the three-moves card behind, the step list in front with 1, 2, 3 */
const card = win("flow-new", "card", L.card.w);
const steps = win("flow-steps", [2284, 670, 728, 1070], L.steps.w);   // the step panel, inside its scrollbar
const RINGS = ["getdata", "match", "summarize"].map((id, i) => { const [x, y, , h] = SH["flow-steps"].items[id]; return place(steps.el, steps.box([x, y, 702, h]), "ring", `<span class="n">${i + 1}</span>`); });

/* two funnels from the Leads view, one per source (Instagram, Facebook): the numbers sit on top,
   the funnel under them draws itself left to right, and each rate is ringed as the draw passes it */
const FUN = [
  { crop: "ig", pills: [[2208, 648, 122, 42], [2536, 648, 122, 42], [2864, 648, 122, 42]] },
  { crop: "fb", pills: [[796, 1528, 122, 42], [1124, 1528, 122, 42], [1452, 1528, 122, 42]] },
].map((f, i) => {
  const w = win("leads", f.crop, L.funnel.w), [x0, y0] = w.crop;
  const g = w.box([x0 + 46, y0 + 192, 1330, 412]);           // the funnel itself, under the header's rule
  const box = place(w.el, g, "drawbox");
  const edge = place(box, [0, 0, 160, g[3]], "edge"), rest = place(box, [0, 0, g[2], g[3]], "rest");
  const rings = f.pills.map((r) => { const [x, y, pw, ph] = w.box(r); return place(w.el, [x - 6, y - 6, pw + 12, ph + 12], "pring"); });
  return { w, g, edge, rest, rings, ...L.funnel.at[i] };
});

/* captions */
for (const id of ["c1", "c2", "c3", "c4"]) Object.assign($(id).style, { left: L.cap.x + "px", top: L.cap.y + "px", fontSize: L.cap.size + "px" });
Object.assign($("kick").style, { left: L.kick.x + "px", top: L.kick.y + "px" });
Object.assign($("glow").style, { width: L.glow.s + "px", height: L.glow.s + "px", left: L.glow.x - L.glow.s / 2 + "px", top: L.glow.y - L.glow.s / 2 + "px" });
$("mark").style.width = L.mark * 1.6 + "px"; $("mark").style.height = L.mark + "px";
for (const c of ["r1", "r2"]) $(c).style.strokeWidth = "4.6";

/* ── keyframes: K(t, [[t0, v0], [t1, v1, ease], …]) ─────────────────── */
const lerp = (a, b, p) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * p) : a + (b - a) * p;
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e = E.inOut] = keys[i], [t0, v0] = keys[i - 1];
    if (t <= t1) return lerp(v0, v1, e(Math.min(1, Math.max(0, (t - t0) / Math.max(1e-6, t1 - t0)))));
  }
  return keys[keys.length - 1][1];
}
// a window's pose: centre (cx, cy) on the frame, depth z, rotations, scale, opacity, blur
function pose(w, p, origin) {
  const { cx, cy, z = 0, rx = 0, ry = 0, rz = 0, s = 1, o = 1, blur = 0 } = p;
  const [ox, oy] = origin || [w.w / 2, w.h / 2];
  w.el.style.transformOrigin = `${ox}px ${oy}px`;
  w.el.style.transform = `translate3d(${cx - ox}px, ${cy - oy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
  w.el.style.opacity = String(Math.max(0, Math.min(1, o)));
  w.el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "";
}
// speed → blur, for the whips
const speed = (f, t) => Math.hypot(...[0, 1].map((i) => f(t)[i] - f(t - 1 / 60)[i]));

const tl = new NZ.Timeline({ duration: 6.55, tail: 0.45 });

/* ── captions and the end card (the Timeline's own tracks) ─────────── */
const rise = (id, at) => tl.stagger(NZ.splitWords("#" + id), { at, dur: 0.55, ease: E.out, from: { y: L.cap.size * 1.15 }, to: { y: 0 } }, 0.055);
const leave = (id, at) => tl.add("#" + id, { at, dur: 0.24, ease: E.in, to: { opacity: 0, y: -26, blur: 10 } });
tl.add("#kick", { at: 0.1, dur: 0.5, ease: E.out, from: { opacity: 0, y: 14 }, to: { opacity: 1, y: 0 } });
rise("c1", 0.18); leave("c1", 1.58); tl.add("#kick", { at: 1.58, dur: 0.24, ease: E.in, to: { opacity: 0 } });
rise("c2", 1.9); leave("c2", 2.66);
rise("c3", 3.0); leave("c3", 4.18);
rise("c4", 4.42); leave("c4", 5.5);
tl.add("#r1", { at: 5.66, dur: 0.62, ease: E.inOut, from: { draw: 0 }, to: { draw: 1 } });
tl.add("#r2", { at: 5.74, dur: 0.62, ease: E.inOut, from: { draw: 0 }, to: { draw: 1 } });
tl.add("#mark", { at: 5.62, dur: 0.9, ease: E.out, from: { scale: 0.82, opacity: 0 }, to: { scale: 1, opacity: 1 } });
tl.add("#name", { at: 5.96, dur: 0.6, ease: E.out, from: { opacity: 0, y: 34, blur: 8 }, to: { opacity: 1, y: 0, blur: 0 } });
tl.add("#go", { at: 6.14, dur: 0.7, ease: E.spring, from: { opacity: 0, scale: 0.86 }, to: { opacity: 1, scale: 1 } });

/* ── the camera, frame by frame ─────────────────────────────────────── */
const H0 = L.hero, CX = W / 2, CY = L.diveY;
// the dive: the KPI area's centre becomes the pivot, then moves to the frame centre as the window grows
const [kx, ky, kw] = hero.box(KPI_AREA), KO = [kx + kw / 2, ky + hero.box(KPI_AREA)[3] / 2];
const DIVE_S = L.kpiW / kw;
const heroX = (t) => [K(t, [[0, H0.cx], [1.7, H0.cx], [2.2, CX], [2.74, CX], [3.02, CX - W * 1.25, E.in]]), K(t, [[0, H0.cy + 380], [1.1, H0.cy, E.out], [1.7, H0.cy - 20, E.linear], [2.2, CY]])];

tl.every((t) => {
  /* ambient: the glow breathes and drifts, the grid slides */
  $("glow").style.transform = `translate(${Math.sin(t * 0.9) * 40}px, ${Math.cos(t * 0.7) * 30}px) scale(${K(t, [[0, 0.6], [0.8, 1, E.out], [5.6, 1], [6.3, 1.25, E.out]])})`;
  $("glow").style.opacity = String(K(t, [[0, 0], [0.6, 1, E.out], [5.5, 0.85], [6.2, 1]]));
  $("grid").style.transform = `translateY(${(-t * 18) % 96}px)`;

  /* 1 · the dashboard swings up, drifts, then the camera dives into its KPI cards */
  const [hx, hy] = heroX(t);
  const hv = speed(heroX, t);
  pose(hero, {
    cx: hx, cy: hy,
    z: K(t, [[0, -1500], [1.1, 0, E.out], [1.7, 90, E.linear], [2.2, 0]]),
    rx: K(t, [[0, 52], [1.1, 20, E.out], [1.7, 15, E.linear], [2.2, 0], [3.02, 0], ]),
    ry: K(t, [[0, -30], [1.1, -13, E.out], [1.7, -9, E.linear], [2.2, 0], [2.74, 0], [3.02, -24, E.in]]),
    rz: K(t, [[0, 7], [1.1, 1.6, E.out], [1.7, 1, E.linear], [2.2, 0]]),
    s: K(t, [[0, 0.92], [1.1, 1, E.out], [1.7, 1], [2.2, DIVE_S], [2.74, DIVE_S * 1.035, E.linear]]),
    o: K(t, [[0, 0], [0.2, 1, E.out], [2.9, 1], [3.02, 0, E.linear]]),
    blur: Math.min(22, hv * 0.12),
  }, KO);
  hero.sheen.style.transform = `translateX(${K(t, [[0.7, -120], [1.45, 330, E.inOutSoft]])}%) skewX(-12deg)`;
  // the KPI cards lift off the screen
  lifts.forEach((d, i) => {
    const a = 2.2 + i * 0.08;
    const p = K(t, [[a, 0], [a + 0.34, 1, E.back], [2.74, 1]]);
    d.style.transform = `translateY(${-14 * p}px) scale(${1 + 0.07 * p})`;
    d.style.boxShadow = `0 0 0 ${3 * p}px rgba(47,95,216,${0.9 * p}), 0 ${26 * p}px ${50 * p}px -${16 * p}px rgba(10,20,60,${0.55 * p})`;
  });

  /* 2 · whip to the flow builder: the card, then the step list over it; rings 1, 2, 3 */
  const cardX = (tt) => [K(tt, [[2.78, L.card.cx + W * 1.2], [3.2, L.card.cx, E.out], [4.2, L.card.cx - 20, E.linear]]), L.card.cy];
  const stepX = (tt) => [K(tt, [[2.88, L.steps.cx + W * 1.2], [3.32, L.steps.cx, E.out], [4.2, L.steps.cx + 16, E.linear]]), L.steps.cy];
  const out2 = (tt) => K(tt, [[4.18, 0], [4.5, 1, E.in]]);
  const [cx2, cy2] = cardX(t), [sx2, sy2] = stepX(t);
  pose(card, { cx: cx2, cy: cy2, z: K(t, [[3.2, -160], [4.18, -120, E.linear], [4.5, 700, E.in]]), rx: 6, ry: K(t, [[2.78, 34], [3.2, 16, E.out], [4.2, 11, E.linear]]), rz: -1.5,
    o: K(t, [[2.78, 0], [2.95, 1], [4.3, 1], [4.5, 0]]), blur: Math.min(20, speed(cardX, t) * 0.1) + out2(t) * 14 });
  pose(steps, { cx: sx2, cy: sy2, z: K(t, [[3.32, 60], [4.18, 90, E.linear], [4.5, 900, E.in]]), rx: 4, ry: K(t, [[2.88, 30], [3.32, -12, E.out], [4.2, -7, E.linear]]), rz: 1,
    o: K(t, [[2.88, 0], [3.05, 1], [4.3, 1], [4.5, 0]]), blur: Math.min(20, speed(stepX, t) * 0.1) + out2(t) * 14 });
  card.sheen.style.transform = `translateX(${K(t, [[3.25, -120], [3.9, 330, E.inOutSoft]])}%) skewX(-12deg)`;
  RINGS.forEach((r, i) => {
    const a = 3.45 + i * 0.17;
    const p = K(t, [[a, 0], [a + 0.3, 1, E.back]]);
    r.style.opacity = String(Math.min(1, p * 1.4));
    r.style.transform = `scale(${1.25 - 0.25 * p})`;
  });

  /* 3 · two funnels rise out of the dark and draw themselves; each rate is ringed as the draw passes */
  FUN.forEach((f, i) => {
    const d = i * 0.12;
    const draw = K(t, [[4.6 + d, 0], [5.2 + d, 1, E.inOut]]);
    pose(f.w, { cx: f.cx, cy: K(t, [[4.36 + d, f.cy + 170], [4.9 + d, f.cy, E.out], [5.5, f.cy - 12, E.linear]]),
      z: K(t, [[4.36 + d, -900], [4.9 + d, 0, E.out], [5.5, 50, E.linear], [5.86, -700, E.in]]),
      rx: K(t, [[4.36 + d, 34], [4.9 + d, 9, E.out], [5.5, 6, E.linear]]), ry: K(t, [[4.36 + d, f.ry * 2.2], [4.9 + d, f.ry, E.out], [5.5, f.ry * 0.8, E.linear]]),
      s: K(t, [[5.5, 1], [5.86, 0.8, E.in]]), o: K(t, [[4.36 + d, 0], [4.55 + d, 1], [5.6, 1], [5.86, 0]]),
      blur: K(t, [[4.36 + d, 12], [4.8 + d, 0, E.out], [5.55, 0], [5.86, 12, E.in]]) });
    const at = draw * (f.g[2] + 160);
    f.edge.style.left = at - 160 + "px"; f.rest.style.left = at + "px";
    f.rings.forEach((r) => {
      const x = parseFloat(r.style.left) + parseFloat(r.style.width) / 2 - f.g[0];
      const p = at > x ? Math.min(1, (at - x) / 110) : 0;
      r.style.opacity = String(E.out(p)); r.style.transform = `scale(${1.3 - 0.3 * E.back(p)})`;
    });
  });
});

NZ.mount(tl, { width: W, height: H });
</script>
