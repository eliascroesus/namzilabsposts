<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Namzilabs · Inside Namzilabs (a tour of the real app)</title>
<link rel="stylesheet" href="../../lib/brand.css">
<style>
  /* One file, two formats:  ?fmt=tall (1080×1920, default)  ·  ?fmt=wide (1920×1080).
     Every screen is a real screenshot (screenshots/app, catalogued in screenshots/shots.js),
     shown through one of its named crops in a clean app window. */
  .world { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .wmask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.04em 0.14em 0; margin-bottom: -0.14em; }
  .wi { display: inline-block; }
  .capbox { position: absolute; display: flex; flex-direction: column; }
  .cap { font-weight: 800; letter-spacing: -0.048em; line-height: .98; text-wrap: balance; }
  .cap em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; padding-right: 0.04em; }
  .kick { font-size: 36px; font-weight: 600; color: var(--muted); letter-spacing: -0.015em; margin-top: 26px; }
  .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 14px; height: 64px; padding: 0 28px 0 22px; margin-bottom: 40px; border-radius: 999px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-2); font-size: 27px; font-weight: 650; letter-spacing: -0.015em; color: var(--ink-2); white-space: nowrap; }
  .pill .dot { width: 12px; height: 12px; }

  /* the app window: a crop of a real screen */
  .win { position: absolute; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px rgba(20, 20, 40, .08), 0 44px 90px -34px rgba(10, 20, 60, .5), 0 14px 30px -14px rgba(10, 20, 60, .22); }
  .win .wbar { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #f4f5f8; border-bottom: 1px solid #e4e6ee; color: #6b6d7c; }
  .win .wbar i { width: 15px; height: 15px; border-radius: 50%; background: #d8dbe3; flex: none; }
  .win .wbar span { margin-left: 12px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  .win .vp { position: relative; overflow: hidden; }
  .win .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .win img { position: absolute; display: block; max-width: none; height: auto; }
  /* a piece: one rect of the same screenshot, lifted out so it can move on its own */
  .pw { position: absolute; }
  .pw > .clip { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
  .cover { position: absolute; }
  .sweep { position: absolute; overflow: hidden; }
  .sweep .cover { top: 0; bottom: 0; }
  /* a rate pill, pinged once the funnel has drawn past it: the pill lifts, a blue ring comes up around it */
  .pring { position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 3px var(--blue), 0 12px 26px -8px rgba(20, 40, 120, .45); }
  /* blue focus rings with numbered badges, as on the highlights */
  .ring { position: absolute; border: 5px solid var(--blue); border-radius: 20px; box-shadow: 0 0 0 9px rgba(47, 95, 216, .16); }
  .ring .n { position: absolute; right: 22px; top: -29px; width: 54px; height: 54px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 29px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 8px 18px rgba(20, 40, 120, .35); }
  /* the "Connected" badge's pulse: a green ring that spreads and fades */
  .halo { position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 calc(var(--g, 0) * 1px) rgba(52, 199, 89, var(--a, 0)); }

  /* end card, as in 04 */
  .end { left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .end .big { font-size: 124px; font-weight: 800; letter-spacing: -0.052em; line-height: .95; }
  .end .big em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; }
  .end .lock { margin-top: 80px; display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 800; letter-spacing: -0.045em; }
  .end .lock .logo { width: 72px; height: 72px; }
  .end .go { margin-top: 30px; }
  .bloom { width: 1000px; height: 1000px; border-radius: 50%; background: radial-gradient(circle, rgba(86, 140, 255, .30), rgba(86, 140, 255, 0) 62%); }
</style>
</head>
<body>
<div class="canvas paper" id="cv">
  <div class="ruled" id="ruled"></div>
  <div class="world" id="world">
    <div class="abs bloom" id="bloom"></div>

    <div class="capbox" id="b0"><span class="pill" id="pill"><span class="dot live"></span>Real screens</span><h1 class="cap" id="c0">Here's what's <em>inside.</em></h1></div>
    <div class="capbox" id="b1"><h1 class="cap" id="c1">Every number, on one <em>screen.</em></h1></div>
    <div class="capbox" id="b2"><h1 class="cap" id="c2">See exactly where it <em>breaks.</em></h1></div>
    <div class="capbox" id="b3"><h1 class="cap" id="c3">Any KPI,<br>in three <em>moves.</em></h1></div>
    <div class="capbox" id="b4"><h1 class="cap" id="c4">Plug in your <em>tools.</em></h1><div class="kick" id="k4">33 tools. No code.</div></div>
    <div class="capbox" id="b5"><h1 class="cap" id="c5">Your best day, at a <em>glance.</em></h1></div>

    <div id="wins"></div>

    <div class="abs end" id="end">
      <div class="big" id="endBig">All your data. One <em>place.</em></div>
      <div class="lock" id="lock"><span class="logo"></span>Namzilabs</div>
      <div class="go" id="go"><span class="btn">Start free · namzilabs.co</span></div>
    </div>
  </div>
</div>

<script src="../../screenshots/shots.js"></script>
<script src="../../lib/motion.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const WIDE = Q.get("fmt") === "wide";
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920;
const $ = (id) => document.getElementById(id);
$("cv").style.width = W + "px"; $("cv").style.height = H + "px";

/* ── layout per format ───────────────────────────────────────────────────
   tall: captions across the top (inside the story-safe zone), the window below
   wide: captions on the left, the window on the right
   fan: where the hook's three screens sit, as [dx, dy, scale, rotate] from the window centre */
const L = WIDE
  ? { cap: 92, hook: 116, cx: 1350, cy: 548, w: { dash: 860, fanL: 940, fanR: 700, fun: 900, card: 760, steps: 560, apps: 920, cal: 690 },
      fan: { dash: [0, 40, 0.62], L: [-250, -160, 0.5, -8], R: [250, -105, 0.42, 8] } }
  : { cap: 100, hook: 132, cx: 540, cy: 1060, w: { dash: 960, fanL: 960, fanR: 800, fun: 960, card: 880, steps: 660, apps: 960, cal: 800 },
      fan: { dash: [0, 95, 0.6], L: [-232, -168, 0.52, -8], R: [236, -120, 0.4, 8] } };

["b0", "b1", "b2", "b3", "b4", "b5"].forEach((id) => {
  const b = $(id);
  if (WIDE) Object.assign(b.style, { left: "110px", top: "0px", width: "720px", height: H + "px", justifyContent: "center" });
  else Object.assign(b.style, { left: "90px", top: id === "b0" ? "250px" : "270px", width: "900px" });
  b.querySelector(".cap").style.fontSize = (id === "b0" ? L.hook : L.cap) + "px";
});
if (WIDE) Object.assign($("bloom").style, { left: "460px", top: "40px" });
else {
  Object.assign($("bloom").style, { left: "40px", top: "330px" });
  $("endBig").style.width = "900px";            // "All your data." over "One place."
  $("end").style.paddingBottom = "160px";        // sits where 04's does
}

/* ── the windows ─────────────────────────────────────────────────────────
   A crop of a real screenshot at width w. Everything inside the window (the
   camera, the pieces, the covers, the rings) is laid out in the image's own
   pixels, scaled by k, so the overlays sit exactly on what they point at.     */
const SH = NZ.SHOTS, ROOT = "../../", BAR = 58;
function win(id, src, crop, w) {
  const s = SH[src];
  const c = Array.isArray(crop) ? crop : s.crops[crop];
  const [cx, cy, cw, ch] = c;
  const k = w / cw, vh = Math.round(ch * k), h = vh + BAR;
  const el = document.createElement("div");
  el.className = "win"; el.id = id;
  Object.assign(el.style, { width: w + "px", left: `${L.cx - w / 2}px`, top: `${Math.round(L.cy - h / 2)}px` });
  el.innerHTML = `<div class="wbar"><i></i><i></i><i></i><span>${s.title}</span></div><div class="vp" style="height:${vh}px"><div class="cam" style="width:${w}px;height:${vh}px"><img src="${ROOT + s.file}" alt="" style="width:${s.w * k}px;left:${-cx * k}px;top:${-cy * k}px"></div></div>`;
  $("wins").appendChild(el);
  const cam = el.querySelector(".cam");
  // a rect in image pixels, as CSS relative to an origin (the crop's corner, or a piece's)
  const box = ([bx, by, bw, bh], pad = 0, [ox, oy] = [cx, cy]) => ({ left: `${(bx - pad - ox) * k}px`, top: `${(by - pad - oy) * k}px`, width: `${(bw + pad * 2) * k}px`, height: `${(bh + pad * 2) * k}px` });
  const add = (d, into) => ((into || cam).appendChild(d), d);
  const W0 = { el, id, s, k, w, vh, h, crop: c, cam, box };
  // a piece: the same screenshot clipped to one rect, so that rect can move on its own.
  // `into` nests it in another piece (it then moves with it).
  W0.piece = (rect, { pad = 0, radius = 0, cls = "", into = null } = {}) => {
    const d = document.createElement("div");
    d.className = "pw " + cls;
    d._o = [rect[0] - pad, rect[1] - pad];
    Object.assign(d.style, box(rect, pad, into ? into._o : [cx, cy]), { borderRadius: `${radius * k}px` });
    d.innerHTML = `<div class="clip"><img src="${ROOT + s.file}" alt="" style="width:${s.w * k}px;left:${-d._o[0] * k}px;top:${-d._o[1] * k}px"></div>`;
    return add(d, into);
  };
  W0.cover = (rect, color, pad = 0) => {
    const d = document.createElement("div");
    d.className = "cover";
    Object.assign(d.style, box(rect, pad), { background: color });
    return add(d);
  };
  W0.ring = (rect, n, pad = 0) => {
    const d = document.createElement("b");
    d.className = "ring";
    Object.assign(d.style, box(rect, pad));
    d.innerHTML = n ? `<span class="n">${n}</span>` : "";
    return add(d);
  };
  return W0;
}
const place = ([dx, dy, sc, rot = 0]) => ({ x: dx, y: dy, scale: sc, rotate: rot });

// 1 · the hook's fan: three screens; the middle one is the dashboard scene 2 opens on
const fanL = win("fanL", "leads", "ig", L.w.fanL);
const fanR = win("fanR", "calendar", "month", L.w.fanR);
const dash = win("dash", "overview", "dash", L.w.dash);
// 3 · the funnel: the Instagram funnel card and its close rate
const fun = win("fun", "leads", "igclose", L.w.fun);
// 4 · any KPI: the three-moves card, then the step picker
const card = win("card", "flow-new", "card", L.w.card);
const steps = win("steps", "flow-steps", "all", L.w.steps);
// 5 · the apps
const apps = win("apps", "apps", "grid", L.w.apps);
// 6 · the calendar
const cal = win("cal", "calendar", "month", L.w.cal);

/* scene details, in image pixels (screenshots/app/*.png) */
// the funnel card's inside, its three rate pills, and the close-rate card below it
const FUN_IN = [1984, 292, 1373, 603];
const PILLS = [[2208, 648, 122, 42], [2536, 648, 122, 42], [2864, 648, 122, 42]];
const CLOSE_IN = [1984, 932, 1373, 204];
const FEATHER = 150;
const sw = document.createElement("div");
sw.className = "sweep";
Object.assign(sw.style, fun.box(FUN_IN));
const swW = FUN_IN[2] * fun.k;
sw.innerHTML = `<div class="cover" id="fcover" style="left:${-FEATHER}px;width:${swW + FEATHER}px;background:linear-gradient(90deg, rgba(255,255,255,0), #fff ${FEATHER}px)"></div>`;
fun.cam.appendChild(sw);
const pings = PILLS.map((r) => fun.piece(r, { radius: 21 }));
const prings = pings.map((p) => p.appendChild(Object.assign(document.createElement("i"), { className: "pring" })));
fun.cover(CLOSE_IN, "#fff");                                   // blank until the funnel has drawn
const closeRate = fun.piece([1984, 940, 700, 190]);            // then its number rises in

// the step picker: Get data, Match, Summarize
const I = SH["flow-steps"].items;
const rings = [["getdata", 1], ["match", 2], ["summarize", 3]].map(([it, n]) => steps.ring(I[it], n, 6));

// the apps: four cards land on the page; Google Sheets' "Connected" badge rides on its card
const CARDS = [[903, 492, 676, 472], [1627, 492, 676, 472], [903, 1012, 676, 472], [1627, 1012, 676, 472]];
const BADGE = [2046, 1046, 223, 40];
apps.el.querySelector(".vp").style.background = "#f3f3f3";
apps.el.querySelector(".cam > img").style.visibility = "hidden";
const cards = CARDS.map((r) => apps.piece(r, { pad: 4 }));
const badge = apps.piece(BADGE, { pad: 1, radius: 7, into: cards[3] });
const halo = badge.appendChild(Object.assign(document.createElement("i"), { className: "halo" }));

// the calendar: fourteen days fill in, then the camera pushes toward the best one
const COLS = [604, 999, 1395], ROWS = [563, 755, 948, 1141, 1333], CELL = [379, 176];
const DAYS = [];
ROWS.forEach((y, r) => COLS.forEach((x, c) => { if (!(r === 4 && c === 2)) DAYS.push([x, y, CELL[0], CELL[1]]); }));
DAYS.forEach((d) => cal.cover(d, "#fff", 3));
const cells = DAYS.map((d) => cal.piece(d, { pad: 3 }));
const BEST = [999, 1333, 380, 177];
const bestRing = cal.ring(BEST, null, 9);

/* ── the camera inside a window: a view is [x, y, w] in the crop's own pixels
   (its height follows the window's shape). Every view sits inside the named crop,
   and a move between two of them never leaves it: each edge moves monotonically. */
const view = (w0, [vx, vy, vw]) => { const s = w0.crop[2] / vw; return { tx: -vx * w0.k * s, ty: -vy * w0.k * s, s }; };
function camMove(w0, from, to, at, dur, ease) {
  const a = view(w0, from), b = view(w0, to);
  tl.call(at, dur, (p) => {
    const tx = a.tx + (b.tx - a.tx) * p, ty = a.ty + (b.ty - a.ty) * p, s = a.s + (b.s - a.s) * p;
    w0.cam.style.transform = `translate3d(${tx.toFixed(2)}px, ${ty.toFixed(2)}px, 0) scale(${s.toFixed(5)})`;
  }, { ease, key: w0.id + "Cam" });
}

/* ── timeline ─────────────────────────────────────────────────────────── */
const { ease: E } = NZ;
const tl = new NZ.Timeline({ duration: 21.6, tail: 1.6 });
const words = (id, at, gap = 0.06) => tl.stagger(NZ.splitWords("#" + id), { at, dur: 0.75, ease: E.out, from: { y: 150 }, to: { y: 0 } }, gap);
const out = (sel, at) => tl.add(sel, { at, dur: 0.4, ease: E.in, to: { opacity: 0, y: -40, blur: 8 } });
const winIn = (w0, at) => tl.add(w0.el, { at, dur: 1.0, ease: E.spring, from: { y: 150, scale: 0.96, opacity: 0 }, to: { y: 0, scale: 1, opacity: 1 } });
const winOut = (w0, at) => tl.add(w0.el, { at, dur: 0.45, ease: E.in, to: { y: -70, scale: 0.97, opacity: 0, blur: 10 } });
// when does an eased 0..1 move reach p? (so each pill pings as the sweep passes it)
const when = (ease, p) => { let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (ease(m) < p) lo = m; else hi = m; } return (lo + hi) / 2; };

// 1 · Here's what's inside: the pill, the line, and a fan of three real screens
tl.add("#pill", { at: 0.1, dur: 0.7, ease: E.out, from: { opacity: 0, y: 24 }, to: { opacity: 1, y: 0 } });
words("c0", 0.2, 0.08);
[[fanL, L.fan.L, 0.5], [fanR, L.fan.R, 0.62], [dash, L.fan.dash, 0.74]].forEach(([w0, f, at]) => {
  const p = place(f);
  tl.add(w0.el, { at, dur: 1.1, ease: E.spring, from: { ...p, y: p.y + 220, rotate: p.rotate * 0.3 }, to: p });
  tl.add(w0.el, { at, dur: 0.3, ease: E.out, from: { opacity: 0 }, to: { opacity: 1 } });
});
out("#b0", 2.0);
tl.add(fanL.el, { at: 2.0, dur: 0.6, ease: E.in, to: { x: L.fan.L[0] - 460, y: L.fan.L[1] + 60, rotate: -20, opacity: 0, blur: 6 } });
tl.add(fanR.el, { at: 2.0, dur: 0.6, ease: E.in, to: { x: L.fan.R[0] + 460, y: L.fan.R[1] + 60, rotate: 20, opacity: 0, blur: 6 } });

// 2 · the dashboard: the fan's middle screen opens up, then a slow push toward the KPI cards
tl.add(dash.el, { at: 2.0, dur: 1.05, ease: E.inOut, to: { x: 0, y: 0, scale: 1 } });
words("c1", 2.4, 0.05);
camMove(dash, [0, 0, 1426], [0, 110, 1188], 3.0, 2.4, E.inOutSoft);
out("#b1", 5.4);
winOut(dash, 5.4);

// 3 · the funnel: the card draws itself left to right, each step's rate pings as the line passes it,
//     then the close rate comes in underneath
words("c2", 5.75, 0.05);
winIn(fun, 5.8);
const SW_AT = 5.95, SW_DUR = 2.05, SW_EASE = NZ.bezier(0.3, 0.05, 0.7, 0.95);
tl.add("#fcover", { at: SW_AT, dur: SW_DUR, ease: SW_EASE, from: { x: 0 }, to: { x: swW + FEATHER } });
// a ping is the pill itself, lifted: it only shows once the sweep's soft edge has fully passed the pill,
// so switching it on and off (at its resting size) is invisible, and it never ghosts over the original
PILLS.forEach((r, i) => {
  const right = (r[0] + r[2] - FUN_IN[0]) * fun.k;             // the pill's right edge, inside the sweep
  const at = SW_AT + SW_DUR * when(SW_EASE, (right + FEATHER) / (swW + FEATHER));
  tl.set(pings[i], 0, { opacity: 0 });
  tl.set(pings[i], at, { opacity: 1 });
  tl.add(pings[i], { at, dur: 0.3, ease: E.back, from: { scale: 1 }, to: { scale: 1.28 } });
  tl.add(prings[i], { at, dur: 0.25, ease: E.out, from: { opacity: 0 }, to: { opacity: 1 } });
  tl.add(pings[i], { at: at + 0.5, dur: 0.4, ease: E.inOut, to: { scale: 1 } });
  tl.add(prings[i], { at: at + 0.5, dur: 0.4, ease: E.inOut, to: { opacity: 0 } });
  tl.set(pings[i], at + 0.95, { opacity: 0 });
});
tl.add(closeRate, { at: SW_AT + SW_DUR - 0.1, dur: 0.7, ease: E.out, from: { opacity: 0, y: 18 }, to: { opacity: 1, y: 0 } });
out("#b2", 8.9);
winOut(fun, 8.9);

// 4 · any KPI in three moves: the card, a swipe to the step picker, then 1, 2 and 3 ringed
words("c3", 9.25, 0.05);
winIn(card, 9.3);
camMove(card, [0, 0, 1080], [60, 60, 980], 9.5, 1.5, E.inOutSoft);
// the swipe: sideways under the tall captions, upward in the wide right-hand column
const SWIPE = WIDE ? "y" : "x", GO = WIDE ? 1000 : 1060;
tl.add(card.el, { at: 10.85, dur: 0.8, ease: E.inOutSoft, to: { [SWIPE]: -GO } });
tl.add(steps.el, { at: 10.85, dur: 0.8, ease: E.inOutSoft, from: { [SWIPE]: GO }, to: { [SWIPE]: 0 } });
rings.forEach((r, i) => {
  const at = 11.7 + i * 0.4;
  tl.add(r, { at, dur: 0.5, ease: E.back, from: { opacity: 0, scale: 1.08 }, to: { opacity: 1, scale: 1 } });
  tl.add(r.querySelector(".n"), { at: at + 0.08, dur: 0.5, ease: E.back, from: { scale: 0 }, to: { scale: 1 } });
});
out("#b3", 13.2);
winOut(steps, 13.2);

// 5 · plug in your tools: the apps land one by one, and the connected one says so
words("c4", 13.55, 0.05);
tl.add("#k4", { at: 14.0, dur: 0.7, ease: E.out, from: { opacity: 0, y: 20 }, to: { opacity: 1, y: 0 } });
winIn(apps, 13.6);
cards.forEach((c, i) => tl.add(c, { at: 13.85 + i * 0.12, dur: 0.8, ease: E.spring, from: { opacity: 0, y: 40, scale: 0.94 }, to: { opacity: 1, y: 0, scale: 1 } }));
tl.add(badge, { at: 14.85, dur: 0.2, ease: E.out, to: { scale: 1.1 } });
tl.add(badge, { at: 15.05, dur: 0.6, ease: E.spring, to: { scale: 1 } });
tl.add(halo, { at: 14.85, dur: 0.9, ease: E.out, from: { "--g": 0, "--a": 0.55 }, to: { "--g": 11, "--a": 0 } });
tl.add(halo, { at: 15.45, dur: 0.9, ease: E.out, from: { "--g": 0, "--a": 0.55 }, to: { "--g": 11, "--a": 0 } });
out("#b4", 16.1);
winOut(apps, 16.1);

// 6 · the calendar: the days fill in, then a push toward the best one
words("c5", 16.45, 0.05);
winIn(cal, 16.5);
cells.forEach((c, i) => tl.add(c, { at: 16.7 + i * 0.045, dur: 0.6, ease: E.out, from: { opacity: 0, scale: 0.9 }, to: { opacity: 1, scale: 1 } }));
camMove(cal, [0, 0, 1230], [219, 477, 820], 17.45, 1.5, E.inOutSoft);
tl.add(bestRing, { at: 18.5, dur: 0.55, ease: E.back, from: { opacity: 0, scale: 1.12 }, to: { opacity: 1, scale: 1 } });
out("#b5", 19.2);
winOut(cal, 19.2);

// 7 · end card
tl.add("#bloom", { at: 19.4, dur: 2.0, ease: E.out, from: { scale: 0.4, opacity: 0 }, to: { scale: 1.1, opacity: 1 } });
tl.stagger(NZ.splitWords("#endBig"), { at: 19.5, dur: 0.8, ease: E.out, from: { y: 160 }, to: { y: 0 } }, 0.07);
tl.add("#lock", { at: 20.3, dur: 1.0, ease: E.spring, from: { scale: 0.8, opacity: 0, y: 20 }, to: { scale: 1, opacity: 1, y: 0 } });
tl.add("#go", { at: 20.7, dur: 0.9, ease: E.spring, from: { scale: 0.85, opacity: 0 }, to: { scale: 1, opacity: 1 } });

tl.every((t) => {
  $("ruled").style.transform = `translate3d(0, ${-(t * 6) % 88}px, 0)`;
  if (t > 21.4) $("bloom").style.opacity = String(0.85 + Math.sin((t - 21.4) * 1.8) * 0.15);
  $("world").style.transform = `scale(${1 + Math.min(t, 24) * 0.001})`;
});

NZ.mount(tl, { width: W, height: H });
</script>
