<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post 18 · Things your CRM currently believes</title>
<link rel="stylesheet" href="../../lib/brand.css">
<link rel="stylesheet" href="../../lib/post.css">
<style>
  body { display: flex; flex-direction: column; gap: 40px; padding: 40px; align-items: flex-start; }
  .li { font-size: 37px; }
  .li small { font-size: 28px; }
  .li .strike { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 4px; }
  .fix { padding: 34px 40px; display: flex; gap: 26px; align-items: center; }
  .fix .t { font-size: 30px; font-weight: 600; line-height: 1.3; letter-spacing: -0.018em; color: #fff; }
  .fix .t b { font-weight: 800; }
  .fix .marks { display: flex; flex: none; }
  .fix .marks .mark-disc { width: 64px; height: 64px; margin-left: -16px; border: 3px solid #22438f; box-shadow: none; }
  .fix .marks .mark-disc:first-child { margin-left: 0; }
</style>
</head>
<body>

<template id="x"><span class="bx no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span></template>

<div class="canvas s-portrait paper frame" data-still="ig-01">
  <div class="ruled"></div>
  <div class="top"><span class="brandmini"><span class="logo"></span>Namzilabs</span><span class="count">For sales teams</span></div>
  <h1 class="h1" style="margin-top:40px;font-size:100px">Things your CRM currently <em>believes:</em></h1>
  <div class="lines" data-list style="margin-top:46px;gap:28px"></div>
  <div class="panel-sky fix" style="margin-top:auto">
    <div class="marks"><span class="mark-disc"><span class="mark" data-src="calendly"></span></span><span class="mark-disc"><span class="mark" data-src="close"></span></span><span class="mark-disc"><span class="mark" data-src="stripe"></span></span></div>
    <div class="t">Namzilabs matches the same person across your tools <b>by email or phone,</b> and counts each call once.</div>
  </div>
  <div class="foot" style="padding-top:24px"><span class="demo">Example data</span><span class="site">namzilabs.co</span></div>
</div>

<div class="canvas s-x paper frame" data-still="x-01" style="padding:60px 76px 52px;flex-direction:row;gap:64px">
  <div class="ruled"></div>
  <div style="flex:0 0 560px;display:flex;flex-direction:column">
    <span class="brandmini"><span class="logo"></span>Namzilabs</span>
    <h1 class="h1" style="margin-top:44px;font-size:88px">Things your CRM currently <em>believes:</em></h1>
    <div class="demo" style="margin-top:auto">Example data · namzilabs.co</div>
  </div>
  <div class="lines" data-list="4" style="flex:1;justify-content:center;gap:26px"></div>
</div>

<script>
  const L = [
    ["Dave, dave@ and Dave M. are three leads.", "It's one Dave."],
    ["A call rescheduled three times is three calls.", "It's one call. Rescheduled. Three times."],
    ["“Test Test” is your hottest lead.", "Booked four calls this week."],
    ["A refunded deal is still closed-won.", "Stripe knows. Your CRM doesn't."],
    ["Your setter booked 41 calls.", "19 of them happened."],
  ];
  const x = document.getElementById("x").innerHTML;
  for (const el of document.querySelectorAll("[data-list]")) {
    const n = Number(el.dataset.list) || L.length;
    el.innerHTML = L.slice(0, n).map(([a, b]) => `<div class="li">${x}<div>${a}<small>${b}</small></div></div>`).join("");
  }
</script>
<script src="../../assets/logos/marks.js"></script>
<script src="../../lib/motion.js"></script>
<script>NZ.still();</script>
</body>
</html>
