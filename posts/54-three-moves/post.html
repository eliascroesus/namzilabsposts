  // Feature spotlight: the flow builder, move by move, in the real app. Screens and crops: screenshots/shots.js.
  const { C } = NZ.STORY, SHOT = "Real screenshot";
  NZ.STORY.post("any-kpi", [
    { bg: "sky", h: "Build any metric in three *moves.*", sub: "The real flow builder. No code, no SQL.", viz: C.shot({ src: "flow-new", crop: "card", w: 820 }), demo: SHOT },

    { cta: true, bg: "electric", h: "Which one would you *build?*", sub: "Comment METRICS and we'll send you the recipe.", kw: "METRICS", offer: "Free to start, no card." },
  ], { chip: "Feature · Flow builder", x: { bg: "sky", h: "Build any metric in three *moves.*", sub: "Get the records. Narrow them down. Turn them into a number.", viz: C.shot({ src: "flow-new", crop: "card", w: 640 }), demo: SHOT } });
