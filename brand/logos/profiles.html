<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Namzilabs — profile pictures</title>
<link rel="stylesheet" href="../../lib/brand.css">
<style>
  body { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .canvas { width: 1024px; height: 1024px; }
  .canvas img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<script>
  // 1024×1024 full-bleed squares, one per concept; X and Instagram crop them to a circle
  for (const id of ["01-between", "02-converge", "03-receipt", "04-bridge", "05-merge", "06-namzi", "07-hash", "08-wire", "09-pillars", "10-tittle"]) {
    document.write(`<div class="canvas" data-still="${id}/profile-1024"><img src="${id}/profile.svg"></div>`);
  }
  // the primary mark, in every colourway, plus the eclipse alternate
  for (const g of ["blue", "ink", "sky", "paper"]) {
    document.write(`<div class="canvas" data-still="01-between-mono/profile-${g}-1024"><img src="01-between-mono/profile-${g}.svg"></div>`);
    document.write(`<div class="canvas" data-still="01-between-mono/eclipse-profile-${g}-1024"><img src="01-between-mono/eclipse-profile-${g}.svg"></div>`);
  }
</script>
<script src="../../lib/motion.js"></script>
<script>NZ.still();</script>
</body>
</html>
