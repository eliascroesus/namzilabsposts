<script>
/* ── the mark: two rings, empty in between (defined once, in lib/motion.js) ── */
const MARK = (c, w) => NZ.MARK(c, w);
const ONE_RING = "../logos/one-ring/"; // the 3D gold rings (brand/logos/one-ring/rings.html)

/* ── platforms: size, where the words go, where the picture goes ────────
   X puts the profile photo over the bottom-left, YouTube only shows the middle
   1546×423 on phones, and Facebook crops the sides on mobile, so each platform
   gets its own safe layout. LinkedIn has its own layouts (see ZONE below). */
const P = {
  x:          { W: 1500, H: 500,  head: { x: 110, y: 112, w: 760, size: 86, sub: 27 }, vis: { cx: 1150, cy: 250, s: 1 },    lock: { x: 110, y: 50, size: 34 } },
  "linkedin-company": { W: 1128, H: 191, scale: 2 },
  "linkedin-profile": { W: 1584, H: 396, scale: 2 },
  // YouTube shows the full 2560×1440 only on TVs; desktop shows the middle band (y 508–931), phones the middle 1546×423
  youtube:    { W: 2560, H: 1440, band: { y: 508, h: 423 }, head: { x: 560, y: 590, w: 820, size: 96, sub: 30 }, vis: { cx: 1720, cy: 720, s: 1.05 }, lock: { x: 560, y: 528, size: 38 } },
  // Facebook page cover: phones show only the middle (x 265–1375) and the page photo overlaps the
  // bottom-left on desktop, so the words start at x 380 and sit in the middle, top to bottom
  facebook:   { W: 1640, H: 624,  head: { x: 380, y: 176, w: 560, size: 72, sub: 23 }, vis: { cx: 1228, cy: 312, s: 0.95 }, lock: { x: 380, y: 112, size: 32 }, center: 40, pill: false },
  // Facebook group cover: phones crop the sides too, so the words stay inside x 300–1340, centred top to bottom
  "facebook-group": { W: 1640, H: 856, head: { x: 300, y: 300, w: 640, size: 82, sub: 26 }, vis: { cx: 1300, cy: 428, s: 0.95 }, lock: { x: 300, y: 228, size: 36 }, pill: false, center: 0 },
  // the card X, LinkedIn, Facebook, Slack and iMessage show when someone shares namzilabs.co
  og:         { W: 1200, H: 630,  head: { x: 72, y: 180, w: 560, size: 70, sub: 23 }, vis: { cx: 930, cy: 330, s: 0.86 }, lock: { x: 72, y: 70, size: 32 }, url: true, pill: false },
  // an email-signature strip (shown at 600×150)
  email:      { W: 1200, H: 300,  head: { x: 64, y: 118, w: 760, size: 46, sub: 0, oneLine: true }, vis: { cx: 1010, cy: 150, s: 0.5 }, lock: { x: 64, y: 50, size: 30 }, url: true, pill: false },
};

/* ── LinkedIn ───────────────────────────────────────────────────────────
   A company page shows its cover at 1128×191 with the page logo over the
   bottom-left; a personal profile shows its background at 1584×396 with the
   profile photo over the bottom-left (568×264). Phones show only the middle:
   about 900 of the 1128, and 1200 of the 1584. So on LinkedIn every word and
   every picture that matters sits inside ZONE, and only background art goes
   outside it. Both are saved at 2× (2256×382, 3168×792) so text stays sharp. */
const ZONE = {
  "linkedin-company": { x0: 352, x1: 1004, y0: 24, y1: 167, head: 38, sub: 17, co: true },
  "linkedin-profile": { x0: 612, x1: 1384, y0: 44, y1: 352, head: 70, sub: 26, co: false },
};
const subRow = (c, items, size, align = "left") => items && items.length ? `<div class="bn-sub" style="font-size:${size}px;color:${c.subColor};${align === "center" ? "justify-content:center;" : ""}">${items.map((x, i) => (i ? `<span class="sep">·</span>` : "") + `<span>${x}</span>`).join("")}</div>` : "";
// a headline and its sub line, as one block
function words(c, { head, sub = [], size, subSize, w, align = "left", cls = "bn-head" }) {
  return `<div style="${w ? `width:${w}px;` : ""}text-align:${align};color:${c.fg}"><div class="${cls}" style="font-size:${size}px">${head}</div>${subRow(c, sub, subSize, align)}</div>`;
}
// a column of blocks, centred in the zone's height, starting at x
function col(Z, x, w, blocks, gap = 0, align = "flex-start") {
  return `<div class="bn" style="left:${x}px;top:${Z.y0}px;width:${w}px;height:${Z.y1 - Z.y0}px;display:flex;flex-direction:column;justify-content:center;align-items:${align};gap:${gap}px">${blocks.join("")}</div>`;
}
const exCap = (c, size) => `<div class="excap" style="font-size:${size}px;color:${c.fg}">Example data</div>`;

/* ── the designs ────────────────────────────────────────────────────── */
const CONCEPTS = {
  electric: {
    surface: "electric", fg: "#fff", subColor: "rgba(226,234,255,.85)",
    head: "All your data. One <em>place.</em>", sub: ["33 tools", "any metric", "the whole funnel"],
    visual: (p) => {
      const VH = p.band ? p.band.h : p.H, cy = p.band ? p.band.y + p.band.h / 2 : p.H / 2;
      // as big as the frame allows, without the ring reaching the words
      const room = (p.W - p.head.x - p.head.w - 40) / 0.584;
      const h = Math.min(VH * 1.3, room);
      return `<div class="bn" style="left:${p.W - h * 0.74}px;top:${cy - h / 2}px;width:${h}px;height:${h}px;opacity:.96">${MARK("#fff")}</div>`;
    },
    li(p, pid, Z) {
      const h = Z.co ? 300 : 580; // the ring bleeds off the right edge, where only phones crop it
      return `<div class="bn" style="left:${p.W - h * 0.66}px;top:${p.H / 2 - h / 2}px;width:${h}px;height:${h}px;opacity:.96">${MARK("#fff")}</div>` +
        col(Z, Z.x0, Z.co ? 540 : 560, [words(this, { head: this.head, sub: this.sub, size: Z.co ? 42 : 80, subSize: Z.sub })]);
    },
  },
  funnel: {
    surface: "ink2", fg: "#fff", subColor: "rgba(214,226,255,.7)",
    head: "See where your funnel <em>breaks.</em>", sub: ["across every tool", "cross-referenced", "true numbers"],
    visual: (p) => {
      const s = p.vis.s, cx = p.vis.cx, cy = p.band ? p.band.y + p.band.h / 2 : p.vis.cy;
      const st = [["typeform", "Leads", "1,240"], ["calendly", "Booked", "412"], ["fathom", "Held", "263"], ["stripe", "Paid", "64"]];
      const bw = 520 * s, bh = 62 * s, gap = 18 * s, total = st.length * bh + (st.length - 1) * gap;
      const fr = [1, 0.82, 0.64, 0.47];
      let out = "";
      st.forEach(([t, l, v], i) => {
        const w = bw * fr[i], x = cx - w / 2, y = cy - total / 2 + i * (bh + gap);
        out += `<div class="bn fbar${i === 2 ? " leak" : ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${bh}px;font-size:${23 * s}px;border-radius:${15 * s}px;padding:0 ${18 * s}px 0 ${12 * s}px;gap:${12 * s}px"><span class="mark" data-src="${t}" style="width:${36 * s}px;height:${36 * s}px"></span><span class="l">${l}</span><span class="v">${v}</span></div>`;
      });
      const yl = cy - total / 2 + 2 * (bh + gap) - gap / 2;

      <filter id="di${u}" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".3" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>

// a comic thought cloud (white, outlined), w wide, centred on (cx, cy)
function thought(cx, cy, w, h, ink = "#0f1d4a") {
  _seed = 41;

  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, r = Math.min(rx, ry) * (0.3 + rnd() * 0.08); C.push([cx + Math.cos(a) * (rx - r * 0.7), cy + Math.sin(a) * (ry - r * 0.7), r]); }
  const circ = (sw, fill, stroke) => C.map(([x, y, r]) => `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}"` : ""}/>`).join("") + `<ellipse cx="${cx}" cy="${cy}" rx="${f2(rx * 0.8)}" ry="${f2(ry * 0.72)}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}"` : ""}/>`;

// a yellow cartoon hand (three fingers and a thumb, a white shirt cuff) holding a bitten pink donut
function donutHand() {
  const u = ++_uid, INK = "#14141c", Y = "#ffd90f";
  _seed = 51;

  const SPR = ["#fff", "#ffd23f", "#4dc9ff", "#6be07a", "#ff5a5a", "#b28cff"];

  return `<svg viewBox="0 0 300 400" style="width:100%;height:100%;overflow:visible"><defs><mask id="bite${u}" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="400"><rect width="300" height="400" fill="#fff"/><circle cx="214" cy="48" r="28" fill="#000"/><circle cx="238" cy="80" r="26" fill="#000"/><circle cx="190" cy="34" r="20" fill="#000"/></mask></defs>
    <path d="M104 1400V300Q104 286 118 286H196Q210 286 210 300V1400Z" fill="#fff" stroke="${INK}" stroke-width="6"/><path d="M104 318H210" stroke="${INK}" stroke-width="5"/>
    <path d="M118 292C112 262 100 236 96 212C92 186 124 174 150 176C184 178 214 190 212 222C210 246 198 268 196 292Z" fill="${Y}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
    <g mask="url(#bite${u})"><circle cx="150" cy="128" r="96" fill="#d99a52" stroke="${INK}" stroke-width="6"/><path d="${icing}Z" fill="#ff7eb3" stroke="#e0579a" stroke-width="2"/><circle cx="150" cy="128" r="31" fill="#d99a52"/><circle cx="150" cy="128" r="24" fill="#8fc3ff" stroke="${INK}" stroke-width="6"/>${sp}
      <path d="M92 76A76 76 0 0 1 150 50" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/></g>

    ${finger(104, 170, 70, -14)}${finger(138, 176, 74, -2)}${finger(172, 176, 70, 10)}
    <path d="M100 236C78 222 66 196 76 176C84 160 104 164 110 180C116 196 118 214 124 232" fill="${Y}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/></svg>`;

// the dream: a thought cloud with the two-donut mark, rising from a hand (off-camera, someone is very hungry)
function donutDream(p, o) {
  const hh = o.hw * (400 / 300), floor = o.floor ?? p.H, top = floor - hh * 0.97; // (the sleeve runs on below the frame)
  const tx = o.hx - o.hw * 0.1, ty = top + hh * 0.05; // where the dream rises from: just above the donut

  return thought(o.bx, o.by, bw, bh) + dots + `<div class="bn" style="left:${o.bx - dm / 2}px;top:${o.by - dm / 2}px;width:${dm}px;height:${dm}px">${donutRings()}</div>` +
    `<div class="bn" style="left:${o.hx - o.hw / 2}px;top:${top}px;width:${o.hw}px;height:${hh}px;transform:rotate(-8deg);transform-origin:50% 100%;filter:drop-shadow(0 ${o.hw * 0.04}px ${o.hw * 0.05}px rgba(15,29,74,.25))">${donutHand()}</div>`;

// soft clouds for the donut sky
function skyClouds(p) {
  _seed = 7;
  let s = "";
  const C = [[0.05, 0.14, 0.5], [0.33, 0.03, 0.3], [0.6, 0.97, 0.46], [0.84, 0.07, 0.36], [0.2, 0.93, 0.36], [0.97, 0.6, 0.4]];

// the funnel as a pipe, leaking between booked and held
function leakyPipe(W, H, k) {
  const st = [["typeform", "Leads", "1,240"], ["calendly", "Booked", "412"], ["fathom", "Held", "263"], ["stripe", "Paid", "64"]];

    <rect x="${2 * k}" y="${py - pt / 2}" width="${W - 4 * k}" height="${pt}" rx="${pt / 2}" fill="url(#pipeg)" stroke="#2b2f3a" stroke-width="${1.6 * k}"/>`;

  out += `<div class="excap" style="position:absolute;left:${6 * k}px;top:${py + pt / 2 + 11 * k}px;font-size:${10 * k}px;color:#14141c">Example data</div>`;
  return `<div style="position:relative;width:${W}px;height:${H}px">${out}</div>`;
}
// a wall of the tools Namzilabs connects, fading towards the middle
function logoWall(p, pid) {

/* ── the game, film and series banners: one layout for every size ─────────
   T is where the words go, A where the picture goes. Words stay clear of the

   what phones show. The picture sits on the ground or the sea line when the
   scene has one. */
const POP_BOX = {
  x: { T: { x: 100, y: 40, w: 600, h: 282, v: "top" }, A: { x: 740, y: 30, w: 730, h: 440 }, head: 62, sub: 21, lock: 28, kick: 15 },
  "linkedin-company": { T: { x: 352, y: 18, w: 372, h: 155 }, A: { x: 734, y: 10, w: 270, h: 171 }, head: 27, sub: 13, kick: 10 },
  "linkedin-profile": { T: { x: 612, y: 44, w: 380, h: 308 }, A: { x: 1002, y: 30, w: 382, h: 336 }, head: 42, sub: 17, kick: 13 },
  youtube: { T: { x: 560, y: 520, w: 760, h: 400 }, A: { x: 1340, y: 512, w: 710, h: 416 }, head: 80, sub: 27, lock: 34, kick: 20 },
  facebook: { T: { x: 380, y: 50, w: 520, h: 484 }, A: { x: 912, y: 50, w: 463, h: 524 }, head: 56, sub: 20, lock: 28, kick: 15 },
  "facebook-group": { T: { x: 300, y: 100, w: 580, h: 656 }, A: { x: 895, y: 100, w: 560, h: 656 }, head: 66, sub: 23, lock: 32, kick: 17 },
};
const PH = { "ph-pixel-plain": 0.7, "ph-inter": 0.92, "ph-inter-glow": 0.9, "ph-pixel": 0.8, "ph-pixel-shadow": 0.8, "ph-dialog": 0.4, "ph-fight": 1, "ph-intro": 0.62, "ph-speed": 0.96 };
function popLayout(c, p, pid) {
  const B = POP_BOX[pid], co = pid === "linkedin-company", li = pid.startsWith("linkedin");
  const A = { ...B.A }, T = { ...B.T };
  if (c.groundH) A.floor = p.H - c.groundH(p.H, pid);
  if (c.seaY) A.floor = c.seaY(p.H, pid);
  // a heads-up display across the top pushes the words and the picture down
  if (c.hud && pid === "x") { T.y += 20; T.h -= 20; A.y += 26; A.h -= 26; }
  if (c.hud && pid === "youtube") { T.y += 44; T.h -= 44; A.y += 40; A.h -= 40; }
  if (c.groundH) T.h = Math.min(T.h, A.floor - 14 - T.y); // words stay off the ground
  let html = c.bg(p.W, p.H, pid, A) + (c.hud ? c.hud(p.W, p.H, pid) : "") + c.art(A, pid);
  const head = co ? c.short : c.head, sub = c.subSizes && !c.subSizes.includes(pid) ? "" : co ? c.subShort : c.sub;
  const lock = !li && B.lock ? `<div class="bn-lock" style="font-size:${B.lock}px;color:${c.lockColor};margin-bottom:${f2(B.lock * 0.6)}px">${MARK(c.lockColor)}<span>Namzilabs</span></div>` : "";
  const kick = c.kicker && !co ? `<div class="pk ${c.kickerClass || ""}" style="font-size:${f2(B.kick * (c.kickerScale || 1))}px;color:${c.kickColor || c.fg}">${c.kicker}</div>` : "";
  if (c.scrim) html += `<div class="bn" style="left:${f2(T.x - T.w * 0.28)}px;top:${f2(T.y - T.h * 0.3)}px;width:${f2(T.w * 1.56)}px;height:${f2(T.h * 1.6)}px;background:radial-gradient(closest-side, ${c.scrim}, ${c.scrim.replace(/[\d.]+\)$/, "0)")});z-index:3"></div>`;
  html += `<div class="pop-text" style="left:${T.x}px;top:${T.y}px;width:${T.w}px;height:${T.h}px;justify-content:${T.v === "top" ? "flex-start" : "center"};color:${c.fg}">${lock}${kick}<div class="ph ${c.headClass}" style="font-size:${f2(B.head * (PH[c.headClass] || 1))}px">${head}</div>${sub ? `<div class="ps" style="font-size:${B.sub}px;color:${c.subColor}">${sub}</div>` : ""}</div>`;
  return html;
}
for (const id of POP.IDS) CONCEPTS[id] = { ...POP[id], pop: true, meme: true, grid: false };

// memes skip the link preview and the email signature: those stay on-brand
const MEME_SIZES = ["x", "linkedin-company", "linkedin-profile", "youtube", "facebook", "facebook-group"];

function banner(cid, pid) {
  const c = CONCEPTS[cid], p = P[pid];
  const el = document.createElement("div");
  el.className = c.pop ? "canvas" : `canvas ${c.surface}`;
  if (c.pop) el.style.background = c.surface;
  el.style.width = `${p.W}px`; el.style.height = `${p.H}px`;
  el.dataset.still = `${cid}/${pid}`;
  if (p.scale) el.dataset.scale = p.scale;
  let html = (c.grid === false ? "" : `<div class="grid88"></div>`) + (typeof c.extra === "function" ? c.extra(p, pid) : c.extra || "");

    // every size of a design sits on the same page, so its SVG ids get the size added, or url(#…) would

    html += popLayout(c, p, pid).replace(/\bid="([^"]+)"/g, `id="$1-${u}"`).replace(/url\(#([^)]+)\)/g, `url(#$1-${u})`);
  } else if (ZONE[pid]) {
    html += c.li(p, pid, ZONE[pid]);
  } else if (c.layout) {
    html += c.layout(p, pid);
  } else if (c.minimal) {
    // one big lockup and the line, centred where the profile photo can't reach

    const size = pid === "email" ? 64 : pid === "youtube" ? 118 : Math.min(112, p.H * 0.23);
    html += `<div class="bn" style="left:${avoid}px;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
      <div class="bn-lock" style="font-size:${size}px">${MARK("#fff")}<span>Namzilabs</span></div>
      ${pid === "email" ? "" : `<div style="font-family:var(--serif);font-style:italic;font-size:${size * 0.42}px;color:${c.subColor};margin-top:${size * 0.18}px;letter-spacing:-0.01em">All your data in one place. Any metric. The true numbers.</div>`}</div>`;
  } else {
    html += c.visual(p, pid);
    const sub = p.head.sub ? `<div class="bn-sub" style="font-size:${p.head.sub}px;color:${c.subColor}">${c.sub.map((x, i) => (i ? `<span class="sep">·</span>` : "") + `<span>${x}</span>`).join("")}</div>` : "";

    if (p.center != null) {

      html += `<div class="bn" style="left:${p.head.x}px;top:0;width:${p.head.w}px;height:${p.H}px;padding-bottom:${p.center}px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;color:${c.fg}">
        ${p.lock ? `<div class="bn-lock" style="font-size:${p.lock.size}px;color:${c.fg};margin-bottom:${p.lock.size * 0.95}px">${MARK(c.fg)}<span>Namzilabs</span></div>` : ""}${headHtml}</div>`;
    } else {
      if (p.lock) html += `<div class="bn bn-lock" style="left:${p.lock.x}px;top:${p.lock.y}px;font-size:${p.lock.size}px;color:${c.fg}">${MARK(c.fg)}<span>Namzilabs</span></div>`;
      html += `<div class="bn" style="left:${p.head.x}px;top:${p.head.y}px;width:${p.head.w}px;color:${c.fg}">${headHtml}</div>`;
    }
    if (p.url) html += `<div class="bn" style="left:${p.head.x}px;bottom:${p === P.email ? 40 : 64}px;font-size:${p === P.email ? 22 : 26}px;font-weight:700;letter-spacing:-0.015em;color:${c.fg};opacity:.85">namzilabs.co${p === P.email ? "" : ` <span style="opacity:.6;font-weight:550">· free to start</span>`}</div>`;
  }

// ?only=neon,formula renders just those designs, ?sizes=linkedin-company,… just those sizes (handy while editing)
const Q = new URLSearchParams(location.search), ONLY = Q.get("only"), SIZES = Q.get("sizes");
for (const cid of Object.keys(CONCEPTS)) {
  if (ONLY && !ONLY.split(",").includes(cid)) continue;
  for (const pid of CONCEPTS[cid].sizes || (CONCEPTS[cid].meme ? MEME_SIZES : Object.keys(P))) if (!SIZES || SIZES.split(",").includes(pid)) banner(cid, pid);

// a long headline on a short size shrinks, words and all, until the block fits its box (and so stays clear of
// the profile photo and the crops)
function fitPopText() {
  for (const el of document.querySelectorAll(".pop-text")) {
    const kids = [...el.children], fs = kids.map((c) => parseFloat(c.style.fontSize) || 0);
    for (let k = 1, i = 0; i < 14; i++) {
      const box = el.getBoundingClientRect(), r = kids.map((c) => c.getBoundingClientRect());
      if (Math.min(...r.map((q) => q.top)) >= box.top - 1 && Math.max(...r.map((q) => q.bottom)) <= box.bottom + 1 && r.every((q) => q.right <= box.right + 1)) break;
      k *= 0.95;
      kids.forEach((c, j) => { if (fs[j]) c.style.fontSize = `${fs[j] * k}px`; });
    }
  }
}
window.__ready = document.fonts.ready.then(() => { fitPopText(); return POP.pixelate(); }).then(() => { NZ.still(); return window.__ready; });
