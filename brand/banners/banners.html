<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Namzilabs — banners</title>
<link rel="stylesheet" href="../../lib/brand.css">
<link rel="stylesheet" href="../../lib/post.css">
<style>
  body { display: flex; flex-direction: column; gap: 40px; padding: 40px; align-items: flex-start; }
  .canvas { flex: none; }
  .bn { position: absolute; }
  .bn-head { font-weight: 800; letter-spacing: -0.048em; line-height: 0.96; text-wrap: balance; }
  .bn-head em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; }
  .bn-sub { font-weight: 550; letter-spacing: -0.012em; margin-top: 0.7em; display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; }
  .bn-sub .sep { opacity: .45; }
  .bn-lock { display: flex; align-items: center; gap: 0.36em; font-weight: 800; letter-spacing: -0.045em; white-space: nowrap; }
  .bn-lock svg { height: 1.25em; width: 1.25em; flex: none; }
  .electric { color: #fff; background: radial-gradient(70% 90% at 12% 0%, rgba(140,175,255,.45), transparent 60%), radial-gradient(60% 80% at 100% 100%, rgba(20,40,160,.45), transparent 60%), linear-gradient(135deg, #2451c4 0%, #2f5fd8 50%, #3d6df2 100%); }
  .electric::after, .ink2::after { content: ""; position: absolute; inset: 0; z-index: 50; pointer-events: none; opacity: 0.05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); }
  .grid88 { position: absolute; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(to right, rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 88px 88px; -webkit-mask-image: radial-gradient(120% 120% at 30% 30%, #000 25%, transparent 80%); mask-image: radial-gradient(120% 120% at 30% 30%, #000 25%, transparent 80%); }
  .paper .grid88 { background-image: linear-gradient(to right, rgba(20,20,60,.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(20,20,60,.05) 1px, transparent 1px); }
  .ink2 { color: #fff; background: radial-gradient(45% 80% at 78% 40%, rgba(47,95,216,.38), transparent 70%), radial-gradient(40% 60% at 0% 100%, rgba(86,140,255,.14), transparent 70%), #07090f; }
  .namzi svg { overflow: visible; }
  .rc { background: #fff; color: var(--ink); -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 0.6em) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 0.8em 0.6em repeat-x; mask: linear-gradient(#000 0 0) top / 100% calc(100% - 0.6em) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 0.8em 0.6em repeat-x; box-shadow: 0 30px 60px rgba(0,0,0,.4); padding: 1.3em 1.4em 2em; }
  .rc .h { font-size: .62em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); text-align: center; }
  .rc .d { border-top: 2px dashed #d5d8e3; margin: .7em 0; }
  .rc .l { display: flex; justify-content: space-between; align-items: center; gap: 1em; padding: .22em 0; white-space: nowrap; }
  .rc .l .k { color: var(--muted); font-weight: 500; }
  .rc .l .v { font-weight: 700; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: .3em; }
  .rc .l .v .mark { width: 1.1em; height: 1.1em; }
  .rc .l.sub { font-size: .88em; padding-left: .8em; }
  .rc .l.sub .k, .rc .l.sub .v { color: var(--red); font-weight: 600; }
  .rc .l.t { font-size: 1.45em; padding-top: .3em; }
  .rc .l.t .k { color: var(--ink); font-weight: 750; }
  .rc .l.t .v { font-weight: 800; }
  .disc { position: absolute; border-radius: 50%; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-2); display: grid; place-items: center; }
  .disc .mark { width: 56%; height: 56%; }
  .pill2 { position: absolute; display: inline-flex; align-items: center; gap: .5em; padding: .5em .9em .5em .55em; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 700; letter-spacing: -0.02em; box-shadow: 0 16px 36px -12px rgba(0,0,0,.45); white-space: nowrap; }
  .pill2 .av { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: .8em; font-weight: 800; }
  .fbar { display: flex; align-items: center; background: #fff; color: var(--ink); font-weight: 700; letter-spacing: -0.02em; box-shadow: 0 14px 30px -14px rgba(0,0,0,.6); white-space: nowrap; }
  .fbar .mark { flex: none; }
  .fbar .l { flex: 1; }
  .fbar .v { font-weight: 800; font-variant-numeric: tabular-nums; }
  .fbar.leak { box-shadow: 0 0 0 3px rgba(240,85,61,.9), 0 14px 30px -14px rgba(0,0,0,.6); }
  .leakpill { transform: translate(-50%, -50%); display: inline-flex; align-items: center; border-radius: 999px; background: #f0553d; color: #fff; font-weight: 750; letter-spacing: -0.01em; white-space: nowrap; box-shadow: 0 10px 24px -8px rgba(240,85,61,.7); z-index: 3; }
  .leakpill .dot.red { background: #fff; box-shadow: none; }
</style>
</head>
<body>
<script src="../../assets/logos/marks.js"></script>
<script src="../../lib/motion.js"></script>
<script src="../../lib/mascot.js"></script>
<script>
/* ── the mark, mono (01 Between, no blue) ─────────────────────────────── */
const MARK = (c, lens = c) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M32 18.73A15 15 0 0 1 32 45.27A15 15 0 0 1 32 18.73Z" fill="${lens}"/><circle cx="25" cy="32" r="15" fill="none" stroke="${c}" stroke-width="4.6"/><circle cx="39" cy="32" r="15" fill="none" stroke="${c}" stroke-width="4.6"/></svg>`;

/* ── platforms: size, where the words go, where the picture goes ────────
   X and LinkedIn put the profile photo over the bottom-left, YouTube only
   shows the middle 1546×423 on phones, and Facebook crops the sides on
   mobile, so each platform gets its own safe layout. */
const P = {
  x:          { W: 1500, H: 500,  head: { x: 110, y: 112, w: 760, size: 86, sub: 27 }, vis: { cx: 1150, cy: 250, s: 1 },    lock: { x: 110, y: 50, size: 34 } },
  linkedin:   { W: 1128, H: 191,  head: { x: 56, y: 50, w: 640, size: 42, sub: 0, oneLine: true }, vis: { cx: 940, cy: 96, s: 0.42 }, lock: null },
  "linkedin-profile": { W: 1584, H: 396, head: { x: 560, y: 96, w: 600, size: 64, sub: 22 }, vis: { cx: 1330, cy: 198, s: 0.8 }, lock: null },
  // YouTube shows the full 2560×1440 only on TVs; desktop shows the middle band (y 508–931), phones the middle 1546×423
  youtube:    { W: 2560, H: 1440, band: { y: 508, h: 423 }, head: { x: 560, y: 590, w: 820, size: 96, sub: 30 }, vis: { cx: 1720, cy: 720, s: 1.05 }, lock: { x: 560, y: 528, size: 38 } },
  facebook:   { W: 1640, H: 624,  head: { x: 300, y: 176, w: 700, size: 80, sub: 25 }, vis: { cx: 1190, cy: 312, s: 1 },   lock: { x: 300, y: 112, size: 34 } },
  // Facebook group cover: phones crop the sides too, so the words stay inside x 300–1340
  "facebook-group": { W: 1640, H: 856, head: { x: 300, y: 300, w: 700, size: 88, sub: 27 }, vis: { cx: 1275, cy: 428, s: 0.98 }, lock: { x: 300, y: 228, size: 36 }, pill: false },
  // the card X, LinkedIn, Facebook, Slack and iMessage show when someone shares namzilabs.co
  og:         { W: 1200, H: 630,  head: { x: 72, y: 180, w: 560, size: 70, sub: 23 }, vis: { cx: 930, cy: 330, s: 0.86 }, lock: { x: 72, y: 70, size: 32 }, url: true, pill: false },
  // an email-signature strip (shown at 600×150)
  email:      { W: 1200, H: 300,  head: { x: 64, y: 118, w: 760, size: 46, sub: 0, oneLine: true }, vis: { cx: 1010, cy: 150, s: 0.5 }, lock: { x: 64, y: 50, size: 30 }, url: true, pill: false },
};

/* ── the five banners ───────────────────────────────────────────────── */
const CONCEPTS = {
  electric: {
    surface: "electric", fg: "#fff", subColor: "rgba(226,234,255,.85)",
    head: "All your data. One <em>place.</em>", sub: ["33 tools", "any metric", "the whole funnel"],
    visual: (p) => {
      const VH = p.band ? p.band.h : p.H, cy = p.band ? p.band.y + p.band.h / 2 : p.H / 2;
      // as big as the frame allows, without the ring reaching the words
      const room = (p.W - p.head.x - p.head.w - 40) / 0.584;
      const h = Math.min(VH * (p === P.linkedin ? 1.55 : 1.3), room);
      return `<div class="bn" style="left:${p.W - h * 0.74}px;top:${cy - h / 2}px;width:${h}px;height:${h}px;opacity:.96">${MARK("#fff")}</div>`;
    },
  },
  funnel: {
    surface: "ink2", fg: "#fff", subColor: "rgba(214,226,255,.7)",
    head: "See where your funnel <em>breaks.</em>", sub: ["across every tool", "cross-referenced", "true numbers"],
    visual: (p) => {
      const s = p.vis.s * (p === P.linkedin ? 1.25 : 1), cx = p.vis.cx, cy = p.band ? p.band.y + p.band.h / 2 : p.vis.cy;
      const st = [["typeform", "Leads", "1,240"], ["calendly", "Booked", "412"], ["fathom", "Held", "263"], ["stripe", "Paid", "64"]];
      const bw = 520 * s, bh = 62 * s, gap = 18 * s, total = st.length * bh + (st.length - 1) * gap;
      const fr = [1, 0.82, 0.64, 0.47];
      let out = "";
      st.forEach(([t, l, v], i) => {
        const w = bw * fr[i], x = cx - w / 2, y = cy - total / 2 + i * (bh + gap);
        out += `<div class="bn fbar${i === 2 ? " leak" : ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${bh}px;font-size:${23 * s}px;border-radius:${15 * s}px;padding:0 ${18 * s}px 0 ${12 * s}px;gap:${12 * s}px"><span class="mark" data-src="${t}" style="width:${36 * s}px;height:${36 * s}px"></span><span class="l">${l}</span><span class="v">${v}</span></div>`;
      });
      const yl = cy - total / 2 + 2 * (bh + gap) - gap / 2;
      out += `<div class="bn leakpill" style="left:${cx}px;top:${yl}px;font-size:${19 * s}px;padding:${7 * s}px ${16 * s}px;gap:${9 * s}px"><span class="dot red" style="width:${11 * s}px;height:${11 * s}px"></span>36% of booked calls never happen</div>`;
      return out;
    },
  },
  sources: {
    surface: "paper", fg: "#14141c", subColor: "var(--muted)",
    head: "33 tools. One <em>place.</em>", sub: ["Build any metric across all of them"],
    visual: (p) => {
      const s = p.vis.s, cx = p.vis.cx, cy = p.band ? p.band.y + p.band.h / 2 : p.vis.cy;
      const rx = (p === P.x ? 270 : 300) * s, ry = (p === P.linkedin || p === P.email ? 150 : 172) * s;
      const tools = ["calendly", "stripe", "shopify", "close", "gsheets", "klaviyo", "whop", "aircall", "hubspot", "instantly", "pipedrive", "mailchimp"].filter((t) => window.NZ_MARKS[t]);
      const n = tools.length;
      let out = `<svg class="bn" style="left:0;top:0;overflow:visible" width="${p.W}" height="${p.H}">`;
      tools.forEach((t, i) => { const a = (i / n) * Math.PI * 2 - Math.PI / 2; out += `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a) * rx}" y2="${cy + Math.sin(a) * ry}" stroke="#c9cedd" stroke-width="${Math.max(1, 2 * s)}" stroke-dasharray="${4 * s} ${7 * s}"/>`; });
      out += `</svg>`;
      tools.forEach((t, i) => {
        const a = (i / n) * Math.PI * 2 - Math.PI / 2, d = 74 * s;
        out += `<div class="disc" style="left:${cx + Math.cos(a) * rx - d / 2}px;top:${cy + Math.sin(a) * ry - d / 2}px;width:${d}px;height:${d}px"><span class="mark" data-src="${t}"></span></div>`;
      });
      const m = 150 * s;
      out += `<div class="bn" style="left:${cx - m / 2 - 22 * s}px;top:${cy - m / 2 - 22 * s}px;width:${m + 44 * s}px;height:${m + 44 * s}px;border-radius:28%;background:#14141c;box-shadow:0 24px 60px -18px rgba(20,30,80,.55);display:grid;place-items:center"><div style="width:${m * 0.82}px;height:${m * 0.82}px">${MARK("#fff")}</div></div>`;
      return out;
    },
  },
  namzi: {
    surface: "sky", fg: "#fff", subColor: "rgba(226,234,255,.82)",
    head: "True numbers, not <em>blurry</em> ones.", sub: ["Meet Namzi", "it cross-checks every tool"],
    visual: (p) => {
      const w = p === P.linkedin ? 196 : 430 * p.vis.s;
      const hh = w * 340 / 320;
      const floor = p.band ? p.band.y + p.band.h + 40 : p.H;
      const top = floor - hh * 0.93;
      const pill = p === P.linkedin || p.pill === false ? "" : `<div class="pill2" style="font-size:${22 * p.vis.s}px;left:${p.vis.cx - w * 0.95}px;top:${(p.band ? p.band.y + p.band.h / 2 : p.vis.cy) - 60 * p.vis.s}px;transform:rotate(-4deg)"><span class="av">D</span>Dave · counted once</div>`;
      return `${pill}<div class="bn namzi" style="left:${p.vis.cx - w / 2 + 40 * p.vis.s}px;top:${top}px;width:${w}px">${NZ.mascot({ mood: "happy", pose: "wave", wave: 0.5, dark: true, shadow: false, fx: ["sparkle"] })}</div>`;
    },
  },
  minimal: {
    surface: "ink2", fg: "#fff", subColor: "rgba(214,226,255,.66)", minimal: true,
    head: "", sub: [],
    visual: () => "",
  },
};

function banner(cid, pid) {
  const c = CONCEPTS[cid], p = P[pid];
  const el = document.createElement("div");
  el.className = `canvas ${c.surface}`;
  el.style.width = `${p.W}px`; el.style.height = `${p.H}px`;
  el.dataset.still = `${cid}/${pid}`;
  let html = `<div class="grid88"></div>`;
  if (c.minimal) {
    // one big lockup and the line, centred where the profile photo can't reach
    const avoid = pid === "x" || pid === "linkedin-profile" ? p.W * 0.08 : 0;
    const size = pid === "linkedin" ? 58 : pid === "email" ? 64 : pid === "youtube" ? 118 : Math.min(112, p.H * 0.23);
    html += `<div class="bn" style="left:${avoid}px;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
      <div class="bn-lock" style="font-size:${size}px">${MARK("#fff")}<span>Namzilabs</span></div>
      ${pid === "linkedin" || pid === "email" ? "" : `<div style="font-family:var(--serif);font-style:italic;font-size:${size * 0.42}px;color:${c.subColor};margin-top:${size * 0.18}px;letter-spacing:-0.01em">All your data in one place. Any metric. The true numbers.</div>`}</div>`;
  } else {
    html += c.visual(p);
    if (p.lock) html += `<div class="bn bn-lock" style="left:${p.lock.x}px;top:${p.lock.y}px;font-size:${p.lock.size}px;color:${c.fg}">${MARK(c.fg)}<span>Namzilabs</span></div>`;
    const sub = p.head.sub ? `<div class="bn-sub" style="font-size:${p.head.sub}px;color:${c.subColor}">${c.sub.map((x, i) => (i ? `<span class="sep">·</span>` : "") + `<span>${x}</span>`).join("")}</div>` : "";
    html += `<div class="bn" style="left:${p.head.x}px;top:${p.head.y}px;width:${p.head.w}px;color:${c.fg}"><div class="bn-head" style="font-size:${p.head.size}px${p.head.oneLine ? ";white-space:nowrap" : ""}">${c.head}</div>${sub}</div>`;
    if (p.url) html += `<div class="bn" style="left:${p.head.x}px;bottom:${p === P.email ? 40 : 64}px;font-size:${p === P.email ? 22 : 26}px;font-weight:700;letter-spacing:-0.015em;color:${c.fg};opacity:.85">namzilabs.co${p === P.email ? "" : ` <span style="opacity:.6;font-weight:550">· free to start</span>`}</div>`;
  }
  el.innerHTML = html;
  document.body.appendChild(el);
}

for (const cid of Object.keys(CONCEPTS)) for (const pid of Object.keys(P)) banner(cid, pid);
NZ.still();
</script>
</body>
</html>
