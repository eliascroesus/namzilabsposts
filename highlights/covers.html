<style>
  /* One cover per highlight: Namzi, in 3D, in a small lit scene that says what the highlight is.
     Square, and composed for the circle Instagram crops it to. The scene is WebGL over a CSS
     backdrop (the room, the glow, the out-of-focus lights), so each cover gets its own mood.
       node tools/render-stills.mjs highlights/covers.html highlights/covers --ss 2 */
  body { margin: 0; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; background: #222; }
  .cover { width: 1080px; height: 1080px; position: relative; overflow: hidden; flex: none; }
  .cover .bg, .cover .fx { position: absolute; inset: 0; }
  .cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cover .fx { pointer-events: none; }
  .bokeh { position: absolute; border-radius: 50%; filter: blur(var(--b, 18px)); }
  .guide .cover::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 2000px rgba(0,0,0,.8), inset 0 0 0 3px rgba(255,255,255,.7); pointer-events: none; z-index: 5; }
</style>

<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { namzi } from "../lib/namzi3d.js";
import { props } from "../lib/props3d.js";
const P = props(THREE);

await document.fonts.load("800 40px Inter");
await document.fonts.load("600 40px Inter");
const Q = new URLSearchParams(location.search);
if (Q.get("guide")) document.body.classList.add("guide");

/* ── the backdrop: a dark room lit in the scene's colour, with soft out-of-focus lights ── */
function backdrop(el, c) {
  const bg = document.createElement("div");
  bg.className = "bg";
  bg.style.background = `
    radial-gradient(46% 34% at 50% 80%, ${c.floor} 0%, transparent 70%),
    radial-gradient(60% 50% at 50% 38%, ${c.glow} 0%, transparent 72%),
    radial-gradient(80% 70% at 50% 50%, ${c.mid} 0%, ${c.edge} 100%)`;
  el.appendChild(bg);
  for (const [x, y, s, col, b, o] of c.bokeh || []) {
    const d = document.createElement("div");
    d.className = "bokeh";
    Object.assign(d.style, { left: `${x - s / 2}px`, top: `${y - s / 2}px`, width: `${s}px`, height: `${s}px`, background: col, opacity: o ?? 0.5 });
    d.style.setProperty("--b", `${b ?? 16}px`);
    bg.appendChild(d);
  }
}

/* ── the stage: renderer, lights, shadow floor ── */
function stage(el, c) {
  const W = el.clientWidth, H = el.clientHeight, dpr = window.devicePixelRatio || 1;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = c.exposure ?? 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  el.appendChild(renderer.domElement);

  const s = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  s.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  s.environmentIntensity = c.env ?? 0.4;

  const key = new THREE.DirectionalLight(c.key ?? 0xfff4e8, c.keyI ?? 2.2);
  key.position.set(-3.2, 6, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -4; key.shadow.camera.right = 4; key.shadow.camera.top = 5; key.shadow.camera.bottom = -2;
  key.shadow.radius = 6; key.shadow.bias = -0.0004;
  s.add(key);
  for (const [col, i, x, y, z] of c.rims || []) { const l = new THREE.PointLight(col, i, 14, 1.6); l.position.set(x, y, z); s.add(l); }
  s.add(new THREE.HemisphereLight(0xdbe6ff, 0x1a1f33, c.hemi ?? 0.5));

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: c.shadow ?? 0.42 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  s.add(floor);
  // a soft contact shadow under whatever stands on the floor
  const cv = document.createElement("canvas"); cv.width = cv.height = 256;
  const g = cv.getContext("2d"), rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  rg.addColorStop(0, "rgba(0,0,0,.55)"); rg.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
  const contact = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
  contact.rotation.x = -Math.PI / 2; contact.position.y = 0.002; contact.scale.set(1.9, 1.1, 1);
  s.add(contact);

  const cam = new THREE.PerspectiveCamera(c.fov ?? 26, W / H, 0.1, 100);
  const [cx, cy, cz] = c.cam ?? [0, 1.95, 8.2];
  cam.position.set(cx, cy, cz);
  cam.lookAt(...(c.at ?? [0, 1.55, 0]));
  return { renderer, s, cam, contact, render: () => renderer.render(s, cam) };
}

/* ── materials and small props ── */
const M = {
  glossy: (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15, ...o }),
  glow: (color, i = 2) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: color, emissiveIntensity: i }),
};
const cast = (m) => { m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };

/* ── the scenes ── */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const place = (o, x, y, z, ry = 0, rz = 0, sc = 1) => { o.position.set(x, y, z); o.rotation.y = ry; o.rotation.z = rz; o.scale.setScalar(sc); return o; };
const stick = (a, b, r, mat) => {
  const A = V3(...a), B = V3(...b), len = A.distanceTo(B);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), mat);
  m.position.copy(A).lerp(B, 0.5);
  m.quaternion.setFromUnitVectors(V3(0, 1, 0), B.clone().sub(A).normalize());
  return m;
};
const light = (s, col, i, x, y, z, d = 6) => { const l = new THREE.PointLight(col, i, d, 1.5); l.position.set(x, y, z); s.add(l); return l; };
// the room, per mood: floor pool, glow behind the character, mid and edge tones, soft lights [x, y, size, colour, blur, opacity]
const room = (hue, { lum = 13, ...o } = {}) => ({
  floor: `hsla(${hue},90%,58%,.38)`, glow: `hsla(${hue},90%,60%,.30)`, mid: `hsl(${hue},55%,${lum}%)`, edge: `hsl(${hue},60%,3%)`,
  bokeh: o.bokeh ?? [[180, 260, 90, `hsla(${hue},95%,70%,.55)`, 22], [890, 200, 60, `hsla(${hue},95%,75%,.5)`, 16], [960, 560, 120, `hsla(${hue},90%,60%,.28)`, 30], [120, 640, 70, `hsla(${hue},90%,70%,.3)`, 20], [760, 120, 40, "rgba(255,255,255,.35)", 10]],
  ...o,
});

const SCENES = {
  "start-here": {

  "any-kpi": {

    build(s) {

      place(bars, -1.3, 0.04, -0.75, 0, 0, 0.9);

      s.add(cast(place(P.arrowUp(0x4ade80, 0.9), -0.0, 2.76, -0.75)));
      light(s, 0x4ade80, 6, -0.3, 3.1, 0.2, 3);
      const n = namzi(THREE, { mood: "grin", blush: true, brows: [-4, -2], look: [-0.6, 0.55], arms: { L: { h: [1.05, 2.25, 0.2], c: [1.02, 1.5, 0.12] }, R: "hip" } });
      place(n.group, 0.62, 0, 0.1, -0.16);

  funnel: {

    build(s) {
      const f = cast(P.funnel(0xf4f6ff));
      place(f, -0.84, 1.55, -0.35, 0, 0.12, 0.76);

      for (const [x, y, z] of [[-0.9, 2.66, -0.35], [-0.7, 2.86, -0.25], [-1.06, 2.94, -0.45]]) { const d = P.drop(0x5b8cff, 0.09); d.position.set(x, y, z); s.add(cast(d)); }
      const crack = P.tube([[-0.5, 1.93, 0.03], [-0.46, 1.84, 0.07], [-0.5, 1.77, 0.07], [-0.45, 1.68, 0.09]], 0.016, new THREE.MeshStandardMaterial({ color: 0x3a0d06 }), 24);
      s.add(crack);
      for (const [x, y, sc] of [[-0.4, 1.46, 1], [-0.37, 1.12, 0.85], [-0.34, 0.8, 0.7]]) { const d = P.drop(0xf0553d, 0.09 * sc, { emissive: 0x5a0d02, emissiveIntensity: 0.4 }); d.position.set(x, y, 0.12); s.add(cast(d)); }
      const puddle = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 16), P.glossy(0xf0553d));
      puddle.scale.set(0.3, 0.018, 0.18); puddle.position.set(-0.32, 0.01, 0.2);
      s.add(puddle);
      const mg = P.magnifier();
      place(mg, -0.3, 1.9, 0.5, 0.15, 0.55);
      s.add(cast(mg));
      const n = namzi(THREE, { mood: "o", brows: [-12, -7], look: [-0.85, 0.15], arms: { L: { h: [0.98, 1.44, 0.52], c: [0.96, 1.16, 0.22] }, R: "hip" } });
      place(n.group, 0.72, 0, 0.1, -0.22);
      s.add(cast(n.group));

  "count-once": {

    build(s) {

      place(n.group, 0.62, 0, 0.12, -0.2);
      s.add(cast(n.group));
    },
  },
  receipts: {
    c: { ...room(38, { lum: 14 }), rims: [[0xffc46b, 30, 3, 3, -3], [0x6f9bff, 12, -3.5, 2.5, -2]], at: [0.1, 1.34, 0.3], cam: [0, 1.85, 8.7] },
    build(s) {
      const n = namzi(THREE, { mood: "grin", blush: true, brows: [-4, -2], look: [0.2, 0.05], arms: { R: { h: [0.8, 1.72, 0.62], c: [1.0, 1.25, 0.3] }, L: "hip" } });
      place(n.group, -0.45, 0, 0);
      s.add(cast(n.group));
      const h = n.hand.R;

      rc.castShadow = true; rc.receiveShadow = true;

  },
  connect: {
    c: { ...room(190), rims: [[0x22d3ee, 30, 3, 3, -3], [0x8fb2ff, 14, -3.5, 2.5, -2]], fov: 29, cam: [0, 2.3, 9.2], at: [0, 2.0, 0] },
    build(s) {

      place(n.group, -0.05, 0, 0.2);

  "sales-teams": {
    c: { ...room(350), rims: [[0xfb7185, 30, 3, 3, -3], [0xffb86b, 14, -3.5, 2.5, -2]], at: [0, 1.55, 0] },
    build(s) {
      const ped = cast(P.box(0.86, 0.9, 0.78, 0.08, P.glossy(0x1b1d2a)));
      place(ped, -0.8, 0.45, -0.25);
      s.add(ped);
      const bell = cast(P.bell());
      place(bell, -0.8, 0.9, -0.2, 0, 0, 0.9);
      s.add(bell);
      for (const [x, rz] of [[-1.28, Math.PI * 0.62 + 0.5], [-0.32, -0.6]]) for (const k of [0, 1]) {
        const arc = new THREE.Mesh(new THREE.TorusGeometry(0.14 + k * 0.12, 0.018, 8, 40, 1.2), P.glow(0xffd166, 2.2));
        arc.position.set(x, 1.64, -0.05); arc.rotation.z = rz;
        s.add(arc);

      light(s, 0xffc46b, 5, -0.9, 1.9, 0.8, 3);

  agencies: {

    build(s) {

      place(e, -0.68, 0.1, -0.55, 0.3, 0, 0.86);
      s.add(e);
      const n = namzi(THREE, { mood: "smile", blush: true, brows: [-3, -1], look: [-0.75, 0.4], arms: { L: { h: [0.84, 1.6, 0.42], c: [0.98, 1.24, 0.22] }, R: "hip" } });
      place(n.group, 0.78, 0, 0.15, -0.25);
      s.add(cast(n.group));
      const h = n.hand.L;
      s.add(cast(stick([h.x + 0.02, h.y + 0.02, h.z], [-0.42, 2.18, -0.2], 0.018, P.glossy(0x1b1d2a))));
    },
  },
  creators: {
    c: { ...room(320), rims: [[0xf472b6, 30, 3, 3, -3], [0x8fb2ff, 12, -3.5, 2.5, -2]], at: [0, 1.55, 0] },
    build(s) {
      const rl = P.ringLight(0xfff0f7, 3.4);
      place(rl, 0, -0.25, -1.1, 0, 0, 0.95);
      s.add(cast(rl));
      light(s, 0xffd6ea, 16, 0, 1.7, -0.7, 4);
      const n = namzi(THREE, { mood: "grin", blush: true, brows: [-4, -2], look: [0.1, 0], arms: { R: { h: [0.88, 1.55, 0.7], c: [1.05, 1.12, 0.3] }, L: "wave" } });
      place(n.group, 0, 0, 0.1);
      s.add(cast(n.group));
      const ph = cast(P.phone("#f472b6"));
      const h = n.hand.R;
      place(ph, h.x + 0.02, h.y + 0.3, h.z + 0.04, -0.25, -0.08);
      s.add(ph);
    },
  },
  "e-com": {
    c: { ...room(44, { lum: 13 }), rims: [[0xfacc15, 30, 3, 3, -3], [0x6f9bff, 12, -3.5, 2.5, -2]], at: [0, 1.5, 0] },
    build(s) {
      const n = namzi(THREE, { mood: "grin-big", blush: true, brows: [-5, -2], look: [0.1, 0.05], arms: { L: { h: [0.84, 1.28, 0.42], c: [0.98, 1.3, 0.12] }, R: { h: [0.84, 1.28, 0.42], c: [0.98, 1.3, 0.12] } } });

      const br = cast(P.bag(0xfff7e6, 0x2f5fd8, 0.56, 0.62)); const hr = n.hand.R; place(br, hr.x, hr.y, hr.z + 0.02, -0.3);
      s.add(bl, br);
    },
  },
  faq: {
    c: { ...room(245), rims: [[0x818cf8, 30, 3, 3, -3], [0xf0abfc, 12, -3.5, 2.5, -2]], at: [0, 1.6, 0] },
    build(s) {
      const q = cast(P.question(0xeceaff, 0.16));
      place(q, -0.76, 0.22, -0.5, 0.3, 0, 0.88);
      s.add(q);
      light(s, 0xa5b4fc, 6, -0.9, 2.2, 1.0, 3.5);
      const n = namzi(THREE, { mood: "small", brows: [-9, -2], look: [-0.75, 0.6], arms: { R: "chin", L: "hip" } });
      place(n.group, 0.66, 0, 0.15, -0.28);
      s.add(cast(n.group));
    },
  },
};

const only = Q.get("only") ? Q.get("only").split(",") : Object.keys(SCENES);
for (const id of only) {
  const sc = SCENES[id];
  const el = document.createElement("div");
  el.className = "canvas cover";
  el.dataset.still = id;
  document.body.appendChild(el);
  backdrop(el, sc.c);
  const st = stage(el, sc.c);
  sc.build(st.s, st);
  st.render();
}
window.__done = true;
</script>
